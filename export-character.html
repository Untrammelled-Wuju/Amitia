<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>导出角色图片</title>
<style>
  :root {
    --ob-accent2: #e09a7d;
    --ob-ease: cubic-bezier(0.4, 0, 0.2, 1);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #000;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: system-ui, -apple-system, sans-serif;
    gap: 32px;
    padding: 40px 20px;
  }

  .toolbar {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    justify-content: center;
  }

  .toolbar button, .toolbar label {
    padding: 10px 22px;
    border-radius: 8px;
    border: 1px solid rgba(255,255,255,0.18);
    background: rgba(255,255,255,0.06);
    color: #e0ddd6;
    font-size: 14px;
    cursor: pointer;
    transition: background 0.2s, border-color 0.2s;
  }

  .toolbar button:hover, .toolbar label:hover {
    background: rgba(255,255,255,0.12);
    border-color: rgba(255,255,255,0.3);
  }

  .toolbar button.primary {
    background: rgba(224, 154, 125, 0.24);
    border-color: rgba(224, 154, 125, 0.4);
    color: #f2efe9;
  }

  .toolbar button.primary:hover {
    background: rgba(224, 154, 125, 0.35);
  }

  .toolbar input[type="range"] {
    width: 120px;
    accent-color: var(--ob-accent2);
  }

  .toolbar .size-group {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .toolbar .size-group span {
    color: #a09d95;
    font-size: 13px;
    min-width: 56px;
  }

  .stage {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .core-zone {
    position: relative;
    display: grid;
    place-items: center;
  }

  .core-symbol {
    position: relative;
    width: 54%;
    height: 54%;
    opacity: 0.94;
    transform: scale(1.01);
    filter: drop-shadow(0 0 34px rgba(224, 154, 125, 0.28));
  }

  .sigil-loop {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 76%;
    height: 38%;
    border: 5px solid currentColor;
    border-radius: 50%;
    color: rgba(242, 239, 233, 0.78);
    transform-origin: center;
      }

  .loop-a {
    transform: translate(-50%, -50%) rotate(0deg);
  }

  .loop-b {
    transform: translate(-50%, -50%) rotate(60deg);
  }

  .loop-c {
    transform: translate(-50%, -50%) rotate(120deg);
  }

  .sigil-center {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 18%;
    height: 18%;
    transform: translate(-50%, -50%) rotate(45deg);
    border: 1px solid rgba(224, 154, 125, 0.68);
    border-radius: 34%;
    background: radial-gradient(circle at 35% 35%, rgba(224, 154, 125, 0.22), rgba(200, 121, 91, 0.045));
    box-shadow: 0 0 26px rgba(200, 121, 91, 0.16);
  }

  .pulse {
    position: absolute;
    inset: 26%;
    border: 1px solid rgba(200, 121, 91, 0.2);
    border-radius: 50%;
    opacity: 0;
  }

  .info {
    color: #a09d95;
    font-size: 13px;
    text-align: center;
    line-height: 1.6;
    max-width: 440px;
  }
</style>
</head>
<body>

<div class="toolbar">
  <div class="size-group">
    <span>尺寸:</span>
    <input type="range" id="sizeSlider" min="200" max="1200" value="500" step="20">
    <span id="sizeLabel">500px</span>
  </div>
  <button id="freezeBtn">暂停动画</button>
  <button class="primary" id="exportBtn">导出 PNG</button>
</div>

<div class="stage" id="stage">
  <div class="core-zone" id="coreZone">
    <div class="pulse"></div>
    <div class="core-symbol">
      <span class="sigil-loop loop-a"></span>
      <span class="sigil-loop loop-b"></span>
      <span class="sigil-loop loop-c"></span>
      <span class="sigil-center"></span>
    </div>
  </div>
</div>

<div class="info">
  拖动滑块调整尺寸 · 点击"暂停动画"让角色静止后再导出效果更好<br>
  导出为透明背景 PNG 格式
</div>

<script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
<script>
  const coreZone = document.getElementById('coreZone')
  const stage = document.getElementById('stage')
  const sizeSlider = document.getElementById('sizeSlider')
  const sizeLabel = document.getElementById('sizeLabel')
  const freezeBtn = document.getElementById('freezeBtn')
  const exportBtn = document.getElementById('exportBtn')

  let frozen = false

  sizeSlider.addEventListener('input', () => {
    const val = sizeSlider.value
    sizeLabel.textContent = val + 'px'
    coreZone.style.width = val + 'px'
    coreZone.style.height = val + 'px'
  })

  coreZone.style.width = '500px'
  coreZone.style.height = '500px'

  freezeBtn.addEventListener('click', () => {
    frozen = !frozen
    if (frozen) {
      coreZone.style.animationPlayState = 'paused'
      coreZone.querySelectorAll('*').forEach(el => {
        el.style.animationPlayState = 'paused'
      })
      freezeBtn.textContent = '恢复动画'
    } else {
      coreZone.style.animationPlayState = ''
      coreZone.querySelectorAll('*').forEach(el => {
        el.style.animationPlayState = ''
      })
      freezeBtn.textContent = '暂停动画'
    }
  })

  exportBtn.addEventListener('click', async () => {
    exportBtn.textContent = '导出中...'
    exportBtn.disabled = true

    try {
      const wasFrozen = frozen
      if (!wasFrozen) {
        frozen = true
        coreZone.style.animationPlayState = 'paused'
        coreZone.querySelectorAll('*').forEach(el => {
          el.style.animationPlayState = 'paused'
        })
      }

      await new Promise(r => setTimeout(r, 100))

      const canvas = await html2canvas(stage, {
        backgroundColor: null,
        scale: 2,
        useCORS: true,
        logging: false,
      })

      canvas.toBlob(blob => {
        const url = URL.createObjectURL(blob)
        const a = document.createElement('a')
        a.href = url
        a.download = 'amitia-character.png'
        a.click()
        URL.revokeObjectURL(url)

        if (!wasFrozen) {
          frozen = false
          coreZone.style.animationPlayState = ''
          coreZone.querySelectorAll('*').forEach(el => {
            el.style.animationPlayState = ''
          })
          freezeBtn.textContent = '暂停动画'
        }
      }, 'image/png')
    } catch (e) {
      alert('导出失败: ' + e.message)
    } finally {
      exportBtn.textContent = '导出 PNG'
      exportBtn.disabled = false
    }
  })
</script>
</body>
</html>
