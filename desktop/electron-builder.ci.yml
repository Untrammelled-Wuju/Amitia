appId: cn.amitia.desktop
productName: Amitia
directories:
  output: release-ci
files:
  - dist/**/*
  - resources/icon*.ico
  - resources/tray*.png
  - package.json
extraResources:
  - from: resources/release-runtime
    to: .
    filter:
      - "**/*"
      - "!.release-runtime-assets.json"
  - from: ../plugin/plugin-market
    to: bundled-plugins/plugin-market
    filter:
      - "*.amitiax"
  - from: ../plugin/runtime-insights
    to: bundled-plugins/runtime-insights
    filter:
      - "*.amitiax"
  - from: ../plugin/workspace
    to: bundled-plugins/workspace
    filter:
      - "*.amitiax"
  - from: ../plugin/chat-import
    to: bundled-plugins/chat-import
    filter:
      - "*.amitiax"
  - from: ../plugin/reminders
    to: bundled-plugins/reminders
    filter:
      - "*.amitiax"
  - from: ../plugin/storage
    to: bundled-plugins/storage
    filter:
      - "*.amitiax"
  - from: ../plugin/chat-logs
    to: bundled-plugins/chat-logs
    filter:
      - "*.amitiax"
  - from: ../plugin/memory-hub
    to: bundled-plugins/memory-hub
    filter:
      - "*.amitiax"
  - from: ../plugin/character-hub
    to: bundled-plugins/character-hub
    filter:
      - "*.amitiax"
  - from: ../plugin/creative-workshop-hub
    to: bundled-plugins/creative-workshop-hub
    filter:
      - "*.amitiax"
  - from: ../plugin/game-center-hub
    to: bundled-plugins/game-center-hub
    filter:
      - "*.amitiax"
  - from: ../runtime/plugin-host/dist
    to: runtime/plugin-host/dist
  - from: ../runtime/task-host/dist
    to: runtime/task-host/dist
asar: true
compression: normal
win:
  signExecutable: false
  icon: ../Logo/amitia-character-dark-white-256.ico
  target:
    - target: dir
      arch:
        - x64
