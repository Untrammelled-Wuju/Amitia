appId: cn.amitia.desktop
productName: Amitia
directories:
  output: release-ci
files:
  - dist/**/*
  - resources/icon*.ico
  - resources/tray*.png
  - package.json
extraResources:
  - from: resources/release-runtime
    to: .
    filter:
      - "**/*"
      - "!.release-runtime-assets.json"
  - from: ../runtime/plugin-host/dist
    to: runtime/plugin-host/dist
  - from: ../runtime/task-host/dist
    to: runtime/task-host/dist
asar: true
compression: normal
win:
  signExecutable: false
  icon: ../Logo/amitia-character-dark-white-256.ico
  target:
    - target: dir
      arch:
        - x64
