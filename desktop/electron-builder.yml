appId: cn.amitia.desktop
productName: Amitia
directories:
  output: release
files:
  - dist/**/*
  - package.json
extraResources:
  - from: resources/core
    to: core
  - from: resources/bridge
    to: bridge
  - from: resources/migrations
    to: migrations
  - from: resources/data
    to: data
  - from: resources/config-template
    to: config-template
  - from: resources/qdrant
    to: qdrant
  - from: resources/surrealdb
    to: surrealdb
asar: true
win:
  signAndEditExecutable: false
  icon: resources/icon.ico
  target:
    - target: nsis
      arch:
        - x64
  artifactName: AmitiaSetup-${version}-${arch}.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowElevation: true
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Amitia
  runAfterFinish: true
  deleteAppDataOnUninstall: false

publish:
  - provider: github
    owner: Untrammelled-Wuju
    repo: Amitia
