appId: cn.amitia.desktop
productName: Amitia
directories:
  output: release
files:
  - dist/**/*
  - resources/icon*.ico
  - resources/tray*.png
  - package.json
extraResources:
  - from: release-notes.md
    to: release-notes.md
  - from: resources/core
    to: core
    filter:
      - "AmitiaCore.exe"
      - "node.exe.zip"
      - "node.zip"
      - "sidecar/bundle.mjs"
      - "sidecar/launcher.mjs"
      - "qq-sidecar/bundle.mjs"
      - "qq-sidecar/launcher.mjs"
  - from: resources/bridge
    to: bridge
  - from: resources/migrations
    to: migrations
  - from: resources/data
    to: data
  - from: resources/config-template
    to: config-template
  - from: resources/qdrant
    to: qdrant
  - from: resources/surrealdb
    to: surrealdb
asar: true
compression: normal
win:
  signExecutable: false
  icon: ../Logo/amitia-character-dark-white-256.ico
  target:
    - target: nsis
      arch:
        - x64
  artifactName: AmitiaSetup-${version}-${arch}.${ext}
nsis:
  oneClick: false
  perMachine: false
  differentialPackage: true
  installerIcon: ../Logo/amitia-icon-light.ico
  allowElevation: true
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Amitia
  runAfterFinish: true
  deleteAppDataOnUninstall: false

releaseInfo:
  releaseName: Amitia 26.1.5
  releaseNotesFile: release-notes.md

publish:
  - provider: github
    owner: Untrammelled-Wuju
    repo: Amitia
