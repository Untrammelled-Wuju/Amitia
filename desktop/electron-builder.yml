appId: cn.amitia.desktop
productName: Amitia
directories:
  output: release
files:
  - dist/**/*
  - resources/icon*.ico
  - resources/tray*.png
  - package.json
extraResources:
  - from: release-notes.md
    to: release-notes.md
  - from: resources/release-runtime
    to: .
    filter:
      - "**/*"
      - "!.release-runtime-assets.json"
  - from: resources/bridge
    to: bridge
  - from: resources/migrations
    to: migrations
  - from: resources/config-template
    to: config-template
  - from: resources/qdrant/config
    to: qdrant/config
  - from: ../runtime/plugin-host/dist
    to: runtime/plugin-host/dist
  - from: ../runtime/task-host/dist
    to: runtime/task-host/dist
asar: true
compression: normal
win:
  signExecutable: false
  icon: ../Logo/amitia-character-dark-white-256.ico
  target:
    - target: nsis
      arch:
        - x64
  artifactName: AmitiaSetup-${version}-${arch}.${ext}
nsis:
  oneClick: false
  perMachine: false
  differentialPackage: true
  include: nsis/installer.nsh
  installerIcon: ../Logo/amitia-icon-light.ico
  allowElevation: true
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Amitia
  runAfterFinish: true
  deleteAppDataOnUninstall: false

releaseInfo:
  releaseName: Amitia 26.2.0-beta.14
  releaseNotesFile: release-notes.md

publish:
  - provider: generic
    url: https://amitia.untrammelled.top/amitia
    channel: latest
