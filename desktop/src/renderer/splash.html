<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline'; img-src 'self' file: data:"
    />
    <title>Amitia</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: transparent;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        -webkit-user-select: none;
        user-select: none;
      }
      .logo {
        width: 64px;
        height: 64px;
        object-fit: contain;
        -webkit-user-drag: none;
        animation: splash-pulse 2s ease-in-out infinite;
      }
      .logo-dark {
        display: block;
      }
      .logo-light {
        display: none;
      }
      @media (prefers-color-scheme: dark) {
        .logo-dark {
          display: none;
        }
        .logo-light {
          display: block;
        }
      }
      @keyframes splash-pulse {
        0%,
        100% {
          opacity: 0.45;
        }
        50% {
          opacity: 1;
        }
      }
    </style>
  </head>
  <body>
    <img
      class="logo logo-dark"
      src="./assets/amitia-logo-dark.png"
      alt=""
      aria-hidden="true"
    />
    <img
      class="logo logo-light"
      src="./assets/amitia-logo-light.png"
      alt=""
      aria-hidden="true"
    />
  </body>
</html>
