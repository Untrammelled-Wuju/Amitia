name: gamehost

on:
  push:
    branches: [develop, master, main]
    tags:
      - 'v*'
  pull_request:
    branches: [develop, master, main]
    paths:
      - 'backend/go.mod'
      - 'backend/go.sum'
      - 'backend/cmd/server/**'
      - 'backend/config/**'
      - 'backend/internal/accountsession/**'
      - 'backend/internal/extension/**'
      - 'backend/internal/gamehost/**'
      - 'backend/internal/middleware/security/**'
      - 'backend/pkg/gameplugin/**'
      - 'backend/internal/platform/process/**'
      - 'sdk/game-plugin-go/**'
      - 'scripts/sync_game_plugin_go_sdk.py'
      - 'scripts/verify_mock_game_plugin_sdk_vendor.py'
      - 'scripts/verify_game_plugin_contract_parity.py'
      - 'testplugins/game-plugin-demo/**'
      - 'testplugins/mock-amitiax-game-plugin/**'
      - 'tests/gamehost_external/**'
      - '.github/workflows/gamehost.yml'

concurrency:
  group: gamehost-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go-host-gate:
    name: GameHost Go gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.1'
          cache-dependency-path: backend/go.sum
      - name: Verify toolchain
        run: test "$(go version | awk '{print $3}')" = "go1.26.1"
      - name: Vet GameHost and public protocol
        working-directory: backend
        run: |
          go vet ./internal/gamehost/... ./pkg/gameplugin/... ./internal/extension/kernel ./internal/extension/kernel/trusted_service/... ./internal/extension/kernel/amitiax/... ./internal/extension/kernel/manifest_v2/... ./internal/platform/process/... ./cmd/server
      - name: Test GameHost and public protocol
        working-directory: backend
        run: |
          go test -count=1 ./internal/gamehost/... ./pkg/gameplugin/... ./internal/extension/kernel/trusted_service/... ./internal/extension/kernel/amitiax/... ./internal/extension/kernel/manifest_v2/... ./internal/platform/process/... ./cmd/server
          go test -count=1 -run '^(TestPackage(CompatibilityUsesManifestRuntimeSourceOfTruth|PlatformAliases|ModuleCompatibilityChecksMinimumHostVersion|GamePluginNetworkPreflightMatchesRuntimePermissionBoundary|GamePluginArtifactSourcesMustExistInArchive)|TestUnsignedDeveloperSession(Bindings|RejectsEnvironmentWorkspacePolicyAndExpiry))$' ./internal/extension/kernel
      - name: Race-sensitive GameHost packages
        working-directory: backend
        run: |
          go test -race -count=1 ./internal/gamehost/control/... ./internal/gamehost/ipc/... ./internal/gamehost/resource/... ./internal/gamehost/rpc/... ./internal/gamehost/runtime/...
      - name: Cross-compile Windows and macOS process sandbox boundaries
        working-directory: backend
        run: |
          GOOS=windows GOARCH=amd64 go test -c ./internal/platform/process -o /tmp/process-windows.test.exe
          GOOS=windows GOARCH=amd64 go test -c ./internal/extension/kernel/trusted_service -o /tmp/trusted-service-windows.test.exe
          GOOS=darwin GOARCH=amd64 go test -c ./internal/platform/process -o /tmp/process-darwin-amd64.test
          GOOS=darwin GOARCH=amd64 go test -c ./internal/extension/kernel/trusted_service -o /tmp/trusted-service-darwin-amd64.test
          GOOS=darwin GOARCH=arm64 go test -c ./internal/platform/process -o /tmp/process-darwin-arm64.test
          GOOS=darwin GOARCH=arm64 go test -c ./internal/extension/kernel/trusted_service -o /tmp/trusted-service-darwin-arm64.test

  go-sdk-gate:
    name: Standalone Go SDK gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.1'
      - name: Verify generated SDK has no drift
        run: python3 scripts/sync_game_plugin_go_sdk.py --check
      - name: Test standalone public SDK
        working-directory: sdk/game-plugin-go
        run: |
          go test ./...
          if go list -deps ./... | grep -q '^github.com/u-ai/backend'; then
            echo 'ERROR: standalone Go SDK depends on backend module'
            exit 1
          fi
      - name: Build independent Go game plugin
        working-directory: testplugins/game-plugin-demo/go
        run: |
          go test ./...
          go build ./cmd/mock-game-plugin
          if go list -deps ./... | grep -q '^github.com/u-ai/backend'; then
            echo 'ERROR: independent Go plugin still depends on backend module'
            exit 1
          fi
      - name: Run independent Go protocol conformance
        working-directory: testplugins/game-plugin-demo/conformance/go
        run: |
          go test ./...
          if go list -deps ./... | grep -q '^github.com/u-ai/backend'; then
            echo 'ERROR: Go conformance consumer still depends on backend module'
            exit 1
          fi

  typescript-sdk-gate:
    name: TypeScript SDK gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.18.0'
          cache: npm
          cache-dependency-path: backend/pkg/gameplugin/sdk/game-plugin/package-lock.json
      - name: Verify Go / JSON Schema / TypeScript contract parity
        run: python3 scripts/verify_game_plugin_contract_parity.py
      - name: Verify external plugin SDK vendor is current
        run: python3 scripts/verify_mock_game_plugin_sdk_vendor.py
      - name: Install SDK dependencies
        working-directory: backend/pkg/gameplugin/sdk/game-plugin
        run: npm ci
      - name: Test and build SDK
        working-directory: backend/pkg/gameplugin/sdk/game-plugin
        run: |
          npm test -- --runInBand
          npm run build
      - name: Build packaged external TypeScript plugin
        working-directory: testplugins/mock-amitiax-game-plugin
        run: |
          npm ci
          npm run build
          npm run package
          npm run verify-package
      - name: Typecheck external E2E harness
        working-directory: tests/gamehost_external
        run: |
          npm ci
          npx tsc --noEmit

  external-gamehost-e2e:
    name: Real external GameHost E2E (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: [go-host-gate, go-sdk-gate, typescript-sdk-gate]
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-26]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.1'
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: '20.18.0'
          cache: npm
          cache-dependency-path: |
            testplugins/mock-amitiax-game-plugin/package-lock.json
            tests/gamehost_external/package-lock.json
      - name: Verify toolchain
        run: go version
      - name: Install Linux sandbox backend
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap iproute2 slirp4netns curl
          bwrap --version
          slirp4netns --version
          ip -Version
      - name: Exercise Linux unrestricted outbound sandbox
        if: runner.os == 'Linux'
        working-directory: backend
        env:
          AMITIA_TEST_LINUX_UNRESTRICTED_NETWORK: '1'
        run: go test -count=1 -run '^TestLinuxUnrestrictedNetworkSandboxE2E$' ./internal/extension/kernel/trusted_service
      - name: Exercise native macOS network sandbox
        if: runner.os == 'macOS'
        working-directory: backend
        env:
          AMITIA_TEST_DARWIN_NETWORK_SANDBOX: '1'
        run: go test -count=1 -run '^TestDarwinNetworkSandboxE2E$' ./internal/extension/kernel/trusted_service
      - name: Verify Windows sandbox prerequisites
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $principal = New-Object Security.Principal.WindowsPrincipal([Security.Principal.WindowsIdentity]::GetCurrent())
          if (-not $principal.IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)) {
            throw 'Windows AppContainer unrestricted gate requires an elevated runner for package-scoped firewall enforcement'
          }
          foreach ($path in @(
            "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe",
            "$env:SystemRoot\System32\icacls.exe",
            "$env:SystemRoot\System32\CheckNetIsolation.exe"
          )) {
            if (-not (Test-Path $path)) { throw "Missing Windows sandbox component: $path" }
          }
      - name: Exercise native Windows network sandbox
        if: runner.os == 'Windows'
        working-directory: backend
        env:
          AMITIA_TEST_WINDOWS_NETWORK_SANDBOX: '1'
        run: go test -count=1 -run '^TestWindowsNetworkSandboxE2E$' ./internal/extension/kernel/trusted_service
      - name: Verify Windows crash-control tool
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $taskkill = "$env:SystemRoot\System32\taskkill.exe"
          if (-not (Test-Path $taskkill)) { throw "Missing Windows crash-control component: $taskkill" }
      - name: Build canonical external plugin v1 and v2 packages
        run: node tests/gamehost_external/scripts/build-plugin-fixtures.mjs
      - name: Install and typecheck external E2E harness
        working-directory: tests/gamehost_external
        run: |
          npm ci
          npx tsc --noEmit
      - name: Build and configure isolated GameHost runtime
        run: node tests/gamehost_external/scripts/prepare-e2e.mjs
      - name: Start real backend
        run: node tests/gamehost_external/scripts/restart-backend.mjs start
      - name: Create authenticated developer session
        run: node tests/gamehost_external/scripts/bootstrap-dev-session.mjs
      - name: Execute real external plugin lifecycle and fault matrices
        working-directory: tests/gamehost_external
        run: npm test
      - name: Dump backend log on failure
        if: failure()
        run: node tests/gamehost_external/scripts/dump-backend-log.mjs
      - name: Stop E2E backend
        if: always()
        run: node tests/gamehost_external/scripts/restart-backend.mjs stop
