name: extension-kernel

on:
  push:
    branches: [develop, master]
    paths:
      - 'backend/internal/extension/**'
      - 'backend/cmd/amitia-ext/**'
      - 'backend/cmd/server/**'
      - 'sdk/plugin-cli/**'
      - 'sdk/plugin-sdk/**'
      - 'testdata/extensions/**'
      - '.github/workflows/extension-kernel.yml'
      - '.tool-versions'
      - 'scripts/extension-test.*'
  pull_request:
    branches: [develop]
    paths:
      - 'backend/internal/extension/**'
      - 'backend/cmd/amitia-ext/**'
      - 'backend/cmd/server/**'
      - 'sdk/plugin-cli/**'
      - 'sdk/plugin-sdk/**'
      - 'testdata/extensions/**'

concurrency:
  group: extension-kernel-${{ github.ref }}
  cancel-in-progress: true

jobs:
  toolchain-check:
    name: Toolchain (Go 1.26.1)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Go 1.26.1
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.1'
          cache: false
      - name: Verify Go version
        run: |
          go version
          v=$(go version | awk '{print $3}' | sed 's/go//')
          if [ "$v" != "1.26.1" ]; then
            echo "ERROR: expected go1.26.1, got go$v"
            exit 1
          fi

  backend-build:
    name: Backend build + vet
    runs-on: ubuntu-latest
    needs: toolchain-check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.1'
      - uses: actions/setup-node@v4
        with:
          node-version: '20.18.0'
      - name: Build server
        working-directory: backend
        run: |
          go version
          go vet ./...
          go build ./cmd/server
      - name: Build amitiax CLI
        working-directory: backend
        run: go build -o /tmp/amitiax ./cmd/amitia-ext

  extension-baseline-tests:
    name: Extension baseline tests (must pass before merge)
    runs-on: ubuntu-latest
    needs: backend-build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.1'
      - name: Run extension-kernel repair baseline tests
        working-directory: backend
        run: |
          go test ./internal/extension/kernel/repair_baseline/... -v -count=1

  extension-unit-tests:
    name: Extension kernel unit tests
    runs-on: ubuntu-latest
    needs: extension-baseline-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.1'
      - name: go test ./internal/extension/...
        working-directory: backend
        run: go test ./internal/extension/... -count=1

  frontend-typecheck:
    name: Frontend typecheck
    runs-on: ubuntu-latest
    needs: extension-baseline-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.18.0'
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - name: Install
        working-directory: front
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        working-directory: front
        run: pnpm run typecheck

  sdk-tests:
    name: SDK plugin-cli tests
    runs-on: ubuntu-latest
    needs: extension-baseline-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.18.0'
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - name: Install
        working-directory: sdk/plugin-cli
        run: pnpm install --frozen-lockfile
      - name: Typecheck + test
        working-directory: sdk/plugin-cli
        run: |
          pnpm run typecheck
          pnpm run test
