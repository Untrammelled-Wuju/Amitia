name: extension-kernel

on:
  push:
    branches: [develop, master, main]
    tags:
      - 'v*'
  pull_request:
    branches: [develop]
    paths:
      - 'backend/internal/extension/**'
      - 'backend/cmd/amitia-ext/**'
      - 'backend/cmd/server/**'
      - 'sdk/plugin-cli/**'
      - 'sdk/plugin-sdk/**'
      - 'testdata/extensions/**'
      - 'front/**'
      - 'desktop/**'
      - 'android/**'

concurrency:
  group: extension-kernel-${{ github.ref }}
  cancel-in-progress: true

jobs:
  toolchain-check:
    name: Toolchain (Go 1.26.1)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Go 1.26.1
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.1'
          cache: false
      - name: Verify Go version
        run: |
          go version
          v=$(go version | awk '{print $3}' | sed 's/go//')
          if [ "$v" != "1.26.1" ]; then
            echo "ERROR: expected go1.26.1, got go$v"
            exit 1
          fi

  backend-build:
    name: Backend build + vet
    runs-on: ubuntu-latest
    needs: toolchain-check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.1'
      - uses: actions/setup-node@v4
        with:
          node-version: '20.18.0'
      - name: Build server
        working-directory: backend
        run: |
          go version
          go vet ./...
          go build ./cmd/server
      - name: Build amitiax CLI
        working-directory: backend
        run: go build -o /tmp/amitiax ./cmd/amitia-ext

  extension-baseline-tests:
    name: Extension baseline tests (must pass before merge)
    runs-on: ubuntu-latest
    needs: backend-build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.1'
      - name: Run extension-kernel repair baseline tests
        working-directory: backend
        run: |
          go test ./internal/extension/kernel/repair_baseline/... -v -count=1

  legacy-dependency-check:
    name: Legacy dependency check (CI rejects legacy dependencies in production runtime)
    runs-on: ubuntu-latest
    needs: extension-baseline-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.1'
      - name: Run legacy CI graph tests (production dependency scan)
        working-directory: backend
        run: |
          go test ./internal/extension/ -v -count=1 -run "TestProductionSourceExcludesLegacyWriteImplementations|TestLegacyWriteFilesHaveBuildTag|TestMigrationCLIHasBuildTag|TestProductionDependencyGraphExcludesLegacyMigration|TestLegacyMigrationCLIEntryCompiles"
      - name: Run legacy final zero tests (production runtime exclusions)
        working-directory: backend
        run: |
          go test ./internal/extension/ -v -count=1 -run "TestProductionRuntimeExcludesLegacyDependencies|TestPackageServiceMetricsIncludeLegacyMonitoring|TestPackageServiceInstallRequiresKernelProxy|TestPackageServiceLifecycleRequiresKernelProxy"
      - name: Run legacy counter persistence tests (default build zero counter)
        working-directory: backend
        run: |
          go test ./internal/extension/kernel/ -v -count=1 -run "TestDefaultBuildLegacyWriteCounterAlwaysZero|TestLegacyCountersPersistAcrossReinitializationAndProveZeroWindow"

  backend-race-tests:
    name: Backend race tests (extension kernel)
    runs-on: ubuntu-latest
    needs: legacy-dependency-check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.1'
      - name: Run race tests for extension kernel
        working-directory: backend
        run: |
          go test -race -count=1 -skip "TestConcurrentInvoke" ./internal/extension/kernel/...

  extension-unit-tests:
    name: Extension kernel unit tests
    runs-on: ubuntu-latest
    needs: legacy-dependency-check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.1'
      - name: go test ./internal/extension/...
        working-directory: backend
        run: go test ./internal/extension/... -count=1

  final-gate-verification:
    name: Final gate verification (7 gate metrics must be 0)
    runs-on: ubuntu-latest
    needs: extension-baseline-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.1'
      - name: Run final gate tests
        working-directory: backend
        run: |
          go test ./internal/extension/kernel/repair_baseline/... -v -count=1 -run "TestBaseline_FinalGate"

  frontend-build-test:
    name: Frontend typecheck + test + build
    runs-on: ubuntu-latest
    needs: extension-baseline-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.18.0'
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - name: Install
        working-directory: front
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        working-directory: front
        run: pnpm run typecheck
      - name: Test
        working-directory: front
        run: pnpm run test
      - name: Build
        working-directory: front
        run: pnpm run build

  desktop-build-test:
    name: Desktop (Electron) typecheck + test + build
    runs-on: ubuntu-latest
    needs: extension-baseline-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.18.0'
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - name: Install
        working-directory: desktop
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        working-directory: desktop
        run: pnpm run typecheck
      - name: Test
        working-directory: desktop
        run: pnpm run test
      - name: Build
        working-directory: desktop
        run: pnpm run build

  sdk-tests:
    name: SDK plugin-cli tests
    runs-on: ubuntu-latest
    needs: extension-baseline-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.18.0'
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - name: Install
        working-directory: sdk/plugin-cli
        run: pnpm install --frozen-lockfile
      - name: Typecheck + test
        working-directory: sdk/plugin-cli
        run: |
          pnpm run typecheck
          pnpm run test

  android-build:
    name: Android Gradle build
    runs-on: ubuntu-latest
    needs: extension-baseline-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Setup Gradle
        working-directory: android
        run: |
          chmod +x ./gradlew
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace
