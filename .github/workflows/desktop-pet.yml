name: Desktop Pet
on:
  push:
    branches: [main, master, develop]
    paths:
      - 'backend/internal/desktoppet/**'
      - 'backend/internal/migration/desktop_pet_*.go'
      - 'backend/cmd/**'
      - 'desktop/**'
      - 'front/**'
      - 'contracts/desktop-pet/**'
      - 'scripts/test/run-desktop-pet-*.ps1'
      - 'scripts/audit/desktop_pet_*.ps1'
      - '.github/workflows/desktop-pet.yml'
  pull_request:
    paths:
      - 'backend/internal/desktoppet/**'
      - 'backend/cmd/**'
      - 'desktop/**'
      - 'front/**'
      - 'contracts/desktop-pet/**'

jobs:
  toolchain:
    name: Toolchain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify toolchain versions
        run: |
          echo "Go version from go.mod:"
          grep "^go " backend/go.mod || true
          echo "Node requirement:"
          cat .tool-versions 2>/dev/null || true

  format:
    name: Format
    runs-on: ubuntu-latest
    needs: toolchain
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: 'backend/go.mod'
      - name: Run gofmt
        run: |
          OUTPUT=$(gofmt -l backend/internal/desktoppet backend/cmd/server)
          if [ -n "$OUTPUT" ]; then
            echo "Unformatted files:"
            echo "$OUTPUT"
            exit 1
          fi

  backend-build-vet:
    name: Backend Build & Vet
    runs-on: ubuntu-latest
    needs: format
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: 'backend/go.mod'
      - name: Build backend
        run: cd backend && go build ./...
        working-directory: .
      - name: Run go vet
        run: cd backend && go vet ./internal/desktoppet/... ./internal/migration/... ./cmd/...
        working-directory: .

  desktop-pet-unit:
    name: Desktop Pet Unit Tests
    runs-on: ubuntu-latest
    needs: backend-build-vet
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: 'backend/go.mod'
      - name: Run unit tests
        run: cd backend && go test ./internal/desktoppet/... -count=1
        working-directory: .
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-pet-unit-results
          path: backend/test-output.json

  desktop-pet-race:
    name: Desktop Pet Race Tests
    runs-on: ubuntu-latest
    needs: backend-build-vet
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: 'backend/go.mod'
      - name: Run race tests
        run: cd backend && go test -race ./internal/desktoppet/... -count=1

  desktop-pet-contract:
    name: Desktop Pet Contract Tests
    runs-on: ubuntu-latest
    needs: backend-build-vet
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: 'backend/go.mod'
      - name: Run contract tests
        run: cd backend && go test ./internal/desktoppet/contracts/... -count=1

  desktop-pet-migration:
    name: Desktop Pet Migration Tests
    needs: backend-build-vet
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: 'backend/go.mod'
      - name: Run migration tests
        run: cd backend && go test ./internal/migration/... -count=1

  desktop-pet-security:
    name: Desktop Pet Security Audit
    runs-on: ubuntu-latest
    needs: backend-build-vet
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: 'backend/go.mod'
      - name: Run static audit
        shell: pwsh
        run: |
          & "${{ github.workspace }}/scripts/audit/desktop_pet_forbidden_patterns.ps1" -Paths @("backend/internal/desktoppet", "backend/cmd/server")

  frontend:
    name: Frontend Build & Test
    runs-on: ubuntu-latest
    needs: toolchain
    strategy:
      matrix:
        workspace: [front, desktop]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: '20.18.0'
          cache: pnpm
          cache-dependency-path: '${{ matrix.workspace }}/pnpm-lock.yaml'
      - name: Install dependencies
        run: |
          corepack enable
          pnpm --dir ${{ matrix.workspace }} install --frozen-lockfile
      - name: Typecheck
        run: pnpm --dir ${{ matrix.workspace }} typecheck
      - name: Test
        run: pnpm --dir ${{ matrix.workspace }} test
      - name: Build
        run: pnpm --dir ${{ matrix.workspace }} build

  final-gate:
    name: Final Gate
    runs-on: ubuntu-latest
    needs:
      - format
      - backend-build-vet
      - desktop-pet-unit
      - desktop-pet-race
      - desktop-pet-contract
      - desktop-pet-migration
      - desktop-pet-security
      - frontend
    steps:
      - name: Verify all required jobs passed
        run: |
          echo "All required gates passed"
