name: Desktop Pet
on:
  push:
    branches: [main, master, develop]
    paths:
      - 'backend/**'
      - 'desktop/**'
      - 'front/**'
      - 'mobile_app/**'
      - 'contracts/desktop-pet/**'
      - 'scripts/test/run-desktop-pet-*.ps1'
      - 'scripts/audit/desktop_pet_*.ps1'
      - 'scripts/audit/verify-*.mjs'
      - 'scripts/audit/verify-source-hygiene.mjs'
      - 'scripts/pack-source.ps1'
      - 'desktop/scripts/verify-*.mjs'
      - 'desktop/scripts/release-integrity.mjs'
      - 'DESKTOP_PET_FINALIZATION_SHA256SUMS.txt'
      - '.gitignore'
      - '.github/workflows/desktop-pet.yml'
  pull_request:
    paths:
      - 'backend/**'
      - 'desktop/**'
      - 'front/**'
      - 'mobile_app/**'
      - 'contracts/desktop-pet/**'
      - 'scripts/test/run-desktop-pet-*.ps1'
      - 'scripts/audit/desktop_pet_*.ps1'
      - 'scripts/audit/verify-*.mjs'
      - 'scripts/audit/verify-source-hygiene.mjs'
      - 'scripts/pack-source.ps1'
      - 'desktop/scripts/verify-*.mjs'
      - 'desktop/scripts/release-integrity.mjs'
      - 'DESKTOP_PET_FINALIZATION_SHA256SUMS.txt'
      - '.gitignore'
      - '.github/workflows/desktop-pet.yml'


jobs:
  toolchain:
    name: Toolchain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify toolchain versions
        run: |
          echo "Go version from go.mod:"
          grep "^go " backend/go.mod || true
          echo "Node requirement:"
          cat .tool-versions 2>/dev/null || true

  format:
    name: Format
    runs-on: ubuntu-latest
    needs: toolchain
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: 'backend/go.mod'
      - name: Run gofmt
        run: |
          OUTPUT=$(gofmt -l \
            backend/internal/desktoppet \
            backend/internal/middleware/security \
            backend/internal/runtimeprofile \
            backend/cmd/server)
          if [ -n "$OUTPUT" ]; then
            echo "Unformatted files:"
            echo "$OUTPUT"
            exit 1
          fi

  backend-build-vet:
    name: Backend Build & Vet
    runs-on: ubuntu-latest
    needs: format
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: 'backend/go.mod'
      - name: Build backend
        run: cd backend && go build ./...
        working-directory: .
      - name: Run go vet
        run: cd backend && go vet ./internal/desktoppet/... ./internal/middleware/security ./internal/runtimeprofile/... ./internal/migration/... ./cmd/...
        working-directory: .
      - name: Run desktop-pet CORS integration tests
        run: cd backend && go test ./internal/middleware/security -run 'TestCorsMiddleware_' -count=1
        working-directory: .

  backend-all-tests:
    name: Backend Full Test Gate
    runs-on: ubuntu-latest
    needs: backend-build-vet
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: 'backend/go.mod'
      - name: Run complete backend test suite
        run: cd backend && go test ./... -count=1

  desktop-pet-unit:
    name: Desktop Pet Unit Tests
    runs-on: ubuntu-latest
    needs: backend-build-vet
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: 'backend/go.mod'
      - name: Run unit tests
        run: cd backend && go test ./internal/desktoppet/... -count=1
        working-directory: .
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-pet-unit-results
          path: backend/test-output.json

  desktop-pet-race:
    name: Desktop Pet Race Tests
    runs-on: ubuntu-latest
    needs: backend-build-vet
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: 'backend/go.mod'
      - name: Run race tests
        run: cd backend && go test -race ./internal/desktoppet/... -count=1

  desktop-pet-contract:
    name: Desktop Pet Contract Tests
    runs-on: ubuntu-latest
    needs: backend-build-vet
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: 'backend/go.mod'
      - name: Run contract tests
        run: cd backend && go test ./internal/desktoppet/contracts/... -count=1

  desktop-pet-migration:
    name: Desktop Pet Migration Tests
    needs: backend-build-vet
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: 'backend/go.mod'
      - name: Run migration tests
        run: cd backend && go test ./internal/migration/... -count=1

  desktop-pet-security:
    name: Desktop Pet Security Audit
    runs-on: ubuntu-latest
    needs: backend-build-vet
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: 'backend/go.mod'
      - name: Run static audit
        shell: pwsh
        run: |
          & "${{ github.workspace }}/scripts/audit/desktop_pet_forbidden_patterns.ps1" -Paths @("backend/internal/desktoppet", "backend/cmd/server")
      - name: Verify source hygiene gate
        run: node scripts/audit/verify-source-hygiene.mjs
      - name: Verify Runtime V2 single-track cutover
        run: node scripts/audit/verify-desktop-pet-runtime-singletrack.mjs
      - name: Verify pet player singleton
        run: node desktop/scripts/verify-pet-player-singleton.mjs
      - name: Verify Runtime V2 lifecycle semantics
        run: node desktop/scripts/verify-desktop-pet-runtime-lifecycle-semantics.mjs
      - name: Verify desktop-pet finalization
        run: node desktop/scripts/verify-desktop-pet-finalization.mjs
      - name: Verify frozen finalization hashes
        run: sha256sum -c DESKTOP_PET_FINALIZATION_SHA256SUMS.txt
      - name: Verify release integrity pre-build gate
        run: node desktop/scripts/release-integrity.mjs --pre-build
      - name: Verify cloud-to-device execution boundary
        run: node desktop/scripts/verify-cloud-device-execution-finalization.mjs
      - name: Verify Device Agent desktop-pet freeze gate
        run: node desktop/scripts/verify-desktop-pet-device-agent-freeze-gate.mjs

  frontend:
    name: Frontend Build & Test
    runs-on: ubuntu-latest
    needs: toolchain
    strategy:
      matrix:
        workspace: [front, desktop]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.17.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
          cache: pnpm
          cache-dependency-path: '${{ matrix.workspace }}/pnpm-lock.yaml'
      - name: Install dependencies
        run: |
          corepack enable
          pnpm --dir ${{ matrix.workspace }} install --frozen-lockfile
      - name: Typecheck
        run: pnpm --dir ${{ matrix.workspace }} typecheck
      - name: Test
        run: pnpm --dir ${{ matrix.workspace }} test
      - name: Build
        run: pnpm --dir ${{ matrix.workspace }} build

  mobile:
    name: Mobile Desktop Pet Gate
    runs-on: ubuntu-latest
    needs: toolchain
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Verify Dart SDK floor
        run: dart --version
      - name: Install mobile dependencies
        working-directory: mobile_app
        run: flutter pub get
      - name: Analyze mobile source
        working-directory: mobile_app
        run: flutter analyze --no-fatal-infos
      - name: Run mobile tests
        working-directory: mobile_app
        run: flutter test
      - name: Compile Android desktop-pet host
        working-directory: mobile_app
        run: flutter build apk --debug

  desktop-package:
    name: Desktop Package Gate
    runs-on: windows-latest
    needs: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.17.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
          cache: pnpm
          cache-dependency-path: 'desktop/pnpm-lock.yaml'
      - name: Install desktop dependencies
        run: |
          corepack enable
          pnpm --dir desktop install --frozen-lockfile
      - name: Build and verify packaged Electron desktop pet
        run: pnpm --dir desktop run package:ci

  final-gate:
    name: Final Gate
    runs-on: ubuntu-latest
    needs:
      - format
      - backend-build-vet
      - backend-all-tests
      - desktop-pet-unit
      - desktop-pet-race
      - desktop-pet-contract
      - desktop-pet-migration
      - desktop-pet-security
      - frontend
      - mobile
      - desktop-package
    steps:
      - name: Verify all required jobs passed
        run: |
          echo "All required gates passed"
