<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Amitia - 启动失败</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family:
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        background: #0f1117;
        color: #e1e4e8;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 24px;
      }
      .container {
        max-width: 520px;
        width: 100%;
        text-align: center;
      }
      .icon {
        width: 64px;
        height: 64px;
        margin: 0 auto 24px;
        background: rgba(229, 83, 75, 0.15);
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .icon svg {
        width: 32px;
        height: 32px;
        fill: #e5534b;
      }
      h1 {
        font-size: 22px;
        font-weight: 600;
        margin-bottom: 8px;
      }
      .subtitle {
        font-size: 14px;
        color: #8b949e;
        margin-bottom: 32px;
      }
      .error-box {
        background: #161b22;
        border: 1px solid #30363d;
        border-radius: 8px;
        padding: 20px;
        text-align: left;
        margin-bottom: 24px;
      }
      .error-title {
        font-size: 13px;
        font-weight: 600;
        color: #e5534b;
        margin-bottom: 12px;
      }
      .error-list {
        list-style: none;
        font-size: 13px;
        line-height: 1.8;
        color: #c9d1d9;
      }
      .error-list li::before {
        content: "·";
        margin-right: 8px;
        color: #8b949e;
      }
      .actions {
        display: flex;
        gap: 12px;
        justify-content: center;
      }
      button {
        padding: 8px 20px;
        border-radius: 6px;
        border: 1px solid #30363d;
        background: #21262d;
        color: #c9d1d9;
        font-size: 13px;
        cursor: pointer;
        transition: background 0.15s;
      }
      button:hover {
        background: #30363d;
      }
      button.primary {
        background: #238636;
        border-color: #2ea043;
        color: #ffffff;
      }
      button.primary:hover {
        background: #2ea043;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="icon">
        <svg viewBox="0 0 24 24">
          <path
            d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"
          />
        </svg>
      </div>
      <h1>Amitia Core 启动失败</h1>
      <p class="subtitle">后端服务未能正常启动，请检查以下可能原因</p>
      <div class="error-box">
        <div class="error-title">可能原因</div>
        <ul class="error-list">
          <li>后端文件缺失或损坏</li>
          <li>本地端口 18899 被其他程序占用</li>
          <li>杀毒软件或防火墙拦截了后端进程</li>
          <li>用户数据目录没有写入权限</li>
          <li>配置文件损坏或格式错误</li>
        </ul>
      </div>
      <div class="actions">
        <button onclick="window.location.reload()">重新尝试</button>
        <button class="primary" onclick="window.close()">关闭程序</button>
      </div>
    </div>
  </body>
</html>
