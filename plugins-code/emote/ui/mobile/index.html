<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="transparent">
  <title>表情包管理</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main class="mobile-page">
    <header class="mobile-topbar">
      <button type="button" id="mobile-back" class="icon-button" aria-label="返回">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15.4 5.4 8.8 12l6.6 6.6-1.4 1.4L6 12l8-8 1.4 1.4Z"/></svg>
      </button>
      <div class="title-block">
        <h1>表情包</h1>
        <p>管理表情、分组和 AI 使用</p>
      </div>
      <button type="button" id="refresh" class="icon-button" aria-label="刷新">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17.7 6.3A8 8 0 1 0 20 12h-2a6 6 0 1 1-1.8-4.3L14 10h7V3l-3.3 3.3Z"/></svg>
      </button>
    </header>

    <section class="mobile-content">
      <div class="search-row">
        <label class="search-box">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 4a6 6 0 1 0 3.8 10.6l4.8 4.8 1.4-1.4-4.8-4.8A6 6 0 0 0 10 4Zm0 2a4 4 0 1 1 0 8 4 4 0 0 1 0-8Z"/></svg>
          <input id="search" placeholder="搜索名称、含义或关键词" autocomplete="off">
          <button type="button" id="clear-search" class="clear-button" hidden aria-label="清空搜索">×</button>
        </label>
        <button type="button" id="create-group" class="secondary-button">新建分组</button>
      </div>

      <nav class="filter-nav" aria-label="表情筛选">
        <button type="button" data-view="all" class="filter-chip active">全部</button>
        <button type="button" data-view="recent" class="filter-chip">最近</button>
        <button type="button" data-view="unassigned" class="filter-chip">未分组</button>
        <select id="mobile-group-select" class="mobile-group-select" aria-label="表情分组">
          <option value="view:all">全部表情</option>
          <option value="view:recent">最近使用</option>
          <option value="view:unassigned">未分组</option>
        </select>
      </nav>

      <div id="group-list" class="group-list"></div>

      <div class="action-row">
        <button type="button" class="secondary-button" id="import-folder">导入文件夹</button>
        <button type="button" class="primary-button" id="import-files">导入表情</button>
      </div>

      <div class="bulk" id="bulk" hidden>
        <div class="bulk-head">
          <strong id="selected-count"></strong>
          <button type="button" class="text-button danger" id="bulk-delete">删除</button>
        </div>
        <div class="bulk-actions">
          <select id="bulk-group" class="mobile-select"><option value="">加入分组</option></select>
          <button type="button" class="secondary-button" id="bulk-ai-on">允许 AI</button>
          <button type="button" class="secondary-button" id="bulk-ai-off">禁止 AI</button>
          <button type="button" class="secondary-button" id="bulk-remove-group" hidden>移出分组</button>
        </div>
      </div>

      <div class="result-head">
        <label class="check-label">
          <input type="checkbox" id="select-all">
          <span>全选当前页</span>
        </label>
        <span id="total">0 个表情</span>
      </div>

      <section class="list-panel" id="drop-zone">
        <div class="grid" id="grid"></div>
      </section>
    </section>

    <aside class="detail" id="detail"></aside>
  </main>

  <input id="file-input" hidden type="file" multiple accept=".png,.jpg,.jpeg,.gif,.webp">
  <input id="folder-input" hidden type="file" multiple webkitdirectory accept=".png,.jpg,.jpeg,.gif,.webp">

  <dialog id="import-dialog" class="import-dialog">
    <div class="dialog-shell">
      <header class="dialog-header">
        <div>
          <strong>导入预览</strong>
          <span>确认名称、含义与 AI 使用方式</span>
        </div>
        <button type="button" class="icon-button" id="close-import" aria-label="关闭">×</button>
      </header>
      <div class="dialog-body">
        <section class="defaults">
          <div class="defaults-head">
            <strong>批量设置</strong>
            <span>应用到全部表情</span>
          </div>
          <div class="defaults-row">
            <input id="default-meaning" class="mobile-input" placeholder="批量含义">
            <input id="default-keywords" class="mobile-input" placeholder="批量关键词">
            <select id="default-group" class="mobile-select" multiple></select>
            <label class="switch-row"><input type="checkbox" id="default-ai"><span class="switch-track"></span><span>允许 AI</span></label>
            <button type="button" class="secondary-button" id="apply-defaults">应用到全部</button>
          </div>
        </section>
        <div class="import-list-head">
          <strong>待导入表情</strong>
          <span id="import-count">0 个文件</span>
        </div>
        <div class="import-list" id="import-list"></div>
      </div>
      <footer class="dialog-footer">
        <span id="import-footer-count">0 个待导入文件</span>
        <div class="dialog-actions">
          <button type="button" class="secondary-button" id="cancel-import">取消</button>
          <button type="button" class="primary-button" id="confirm-import">确认导入</button>
        </div>
      </footer>
    </div>
  </dialog>

  <div class="toast" id="toast"></div>
  <script src="./shell.js" defer></script>
  <script src="./index.js" defer></script>
</body>
</html>
