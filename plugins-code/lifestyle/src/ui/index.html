<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>生活系统</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="life-shell">
      <header class="life-header">
        <div>
          <h1>生活系统</h1>
          <p id="subtitle">正在读取角色生活状态...</p>
        </div>
        <button class="icon-button" id="refresh-button" type="button" aria-label="刷新">刷新</button>
      </header>
      <nav class="life-tabs" aria-label="生活系统视图">
        <button type="button" data-view="overview" class="active">总览</button>
        <button type="button" data-view="schedule">日程</button>
        <button type="button" data-view="routine">作息与工作</button>
        <button type="button" data-view="events">事件</button>
        <button type="button" data-view="tendency">倾向</button>
        <button type="button" data-view="data">数据</button>
      </nav>
      <div id="message" class="message" role="status" aria-live="polite"></div>
      <section id="view" class="view"></section>
    </main>
    <script type="module" src="./app.js"></script>
  </body>
</html>
