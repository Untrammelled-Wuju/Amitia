name: amitia_app
description: "Amitia - AI 角色陪伴个人智能体应用"
publish_to: 'none'
version: 26.2.0-beta+2

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  go_router: ^14.6.0
  flutter_riverpod: ^2.6.1
  flutter_animate: ^4.5.0
  flutter_svg: ^2.0.16
  dio: ^5.4.0
  file_picker: ^8.1.7
  image_picker: ^1.1.2
  web_socket_channel: ^3.0.0
  shared_preferences: ^2.2.2
  crypto: ^3.0.7
  flutter_secure_storage: ^9.2.2
  logger: ^2.0.2+1
  webview_flutter: ^4.10.0
  flutter_markdown_plus: ^1.0.12
  flutter_markdown_plus_latex: ^1.0.5
  flutter_math_fork: ^0.7.4
  markdown: ^7.3.1
  mermaid_core:
    path: third_party/mermaid_core
  syntax_highlighter_plus:
    path: third_party/syntax_highlighter_plus
  url_launcher: ^6.3.2
  just_audio: ^0.10.6
  video_player: ^2.11.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

dependency_overrides:
  jni: 1.0.3
  elk:
    path: third_party/elk
  katex_dart:
    path: third_party/katex_dart

flutter:
  uses-material-design: true
