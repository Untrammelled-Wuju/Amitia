<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>White Particle 3D Sphere Logo</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
      background: #000;
    }
  </style>
</head>

<body>
  <canvas id="particleSphere"></canvas>

  <script>
    const canvas = document.getElementById("particleSphere");
    const ctx = canvas.getContext("2d");

    const config = {
      particleCount: 220,
      sphereRadius: 150,
      dotMinSize: 1.2,
      dotMaxSize: 3.2,
      rotateSpeedX: 0.00022,
      rotateSpeedY: 0.00038,
      perspective: 520,
      breathStrength: 0.045,
      breathSpeed: 0.0018,
      enterDuration: 1600,
      color: [255, 255, 255],
      glowColor: [255, 255, 255]
    };

    let width = 0;
    let height = 0;
    let centerX = 0;
    let centerY = 0;
    let startTime = performance.now();
    let particles = [];

    function resize() {
      const dpr = Math.min(window.devicePixelRatio || 1, 2);

      width = window.innerWidth;
      height = window.innerHeight;

      canvas.width = width * dpr;
      canvas.height = height * dpr;

      canvas.style.width = width + "px";
      canvas.style.height = height + "px";

      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

      centerX = width / 2;
      centerY = height / 2;

      config.sphereRadius = Math.min(width, height) * 0.22;
    }

    function createSphereParticles() {
      particles = [];

      const goldenAngle = Math.PI * (3 - Math.sqrt(5));

      for (let i = 0; i < config.particleCount; i++) {
        const y = 1 - (i / (config.particleCount - 1)) * 2;
        const radius = Math.sqrt(1 - y * y);
        const theta = goldenAngle * i;

        const x = Math.cos(theta) * radius;
        const z = Math.sin(theta) * radius;

        particles.push({
          x,
          y,
          z,
          seed: Math.random(),
          enterOffset: Math.random() * 0.35
        });
      }
    }

    function easeOutCubic(t) {
      return 1 - Math.pow(1 - t, 3);
    }

    function rotatePoint(p, time) {
      const angleY = time * config.rotateSpeedY;
      const angleX = time * config.rotateSpeedX;

      const cosY = Math.cos(angleY);
      const sinY = Math.sin(angleY);
      const cosX = Math.cos(angleX);
      const sinX = Math.sin(angleX);

      let x = p.x;
      let y = p.y;
      let z = p.z;

      const x1 = x * cosY - z * sinY;
      const z1 = x * sinY + z * cosY;

      const y2 = y * cosX - z1 * sinX;
      const z2 = y * sinX + z1 * cosX;

      return {
        x: x1,
        y: y2,
        z: z2
      };
    }

    function drawParticle(x, y, size, alpha) {
      ctx.beginPath();
      ctx.arc(x, y, size, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(255, 255, 255, ${alpha})`;
      ctx.fill();

      if (alpha > 0.35 && size > 2) {
        ctx.beginPath();
        ctx.arc(x, y, size * 2.4, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(255, 255, 255, ${alpha * 0.09})`;
        ctx.fill();
      }
    }

    function animate(now) {
      ctx.clearRect(0, 0, width, height);

      const elapsed = now - startTime;
      const enterProgress = Math.min(elapsed / config.enterDuration, 1);
      const enterEase = easeOutCubic(enterProgress);

      const breath =
        1 + Math.sin(now * config.breathSpeed) * config.breathStrength;

      const baseScale = enterEase * breath;

      const sortedParticles = particles
        .map((p) => {
          const rotated = rotatePoint(p, now);

          const depth = rotated.z;
          const perspectiveScale =
            config.perspective / (config.perspective - depth * config.sphereRadius);

          const enterDelay = Math.max(
            0,
            Math.min(1, (enterProgress - p.enterOffset) / (1 - p.enterOffset))
          );

          const localEnter = easeOutCubic(enterDelay);

          const spread = 2.4 - localEnter * 1.4;
          const radius = config.sphereRadius * baseScale * spread;

          const x = centerX + rotated.x * radius * perspectiveScale;
          const y = centerY + rotated.y * radius * perspectiveScale;

          const normalizedDepth = (depth + 1) / 2;

          const size =
            config.dotMinSize +
            (config.dotMaxSize - config.dotMinSize) * normalizedDepth;

          const alpha =
            (0.16 + normalizedDepth * 0.78) *
            localEnter *
            (0.88 + Math.sin(now * 0.002 + p.seed * 10) * 0.08);

          return {
            x,
            y,
            size: size * localEnter,
            alpha,
            z: depth
          };
        })
        .sort((a, b) => a.z - b.z);

      for (const p of sortedParticles) {
        if (p.alpha <= 0.01 || p.size <= 0.1) continue;
        drawParticle(p.x, p.y, p.size, p.alpha);
      }

      requestAnimationFrame(animate);
    }

    window.addEventListener("resize", resize);

    resize();
    createSphereParticles();
    requestAnimationFrame(animate);
  </script>
</body>
</html>
