<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>White Particle 3D Sphere Logo</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
      background: #000;
    }

    .audio-control {
      position: fixed;
      left: 24px;
      bottom: 24px;
      z-index: 10;
      display: flex;
      align-items: center;
      gap: 10px;
      font-family: Arial, sans-serif;
      user-select: none;
    }

    #audioToggle {
      height: 36px;
      padding: 0 16px;
      border: 1px solid rgba(255, 255, 255, 0.28);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.08);
      color: rgba(255, 255, 255, 0.86);
      font-size: 13px;
      cursor: pointer;
      backdrop-filter: blur(10px);
    }

    #audioToggle.active {
      background: rgba(255, 255, 255, 0.18);
      border-color: rgba(255, 255, 255, 0.45);
    }

    #audioStatus {
      color: rgba(255, 255, 255, 0.52);
      font-size: 12px;
      letter-spacing: 0.04em;
    }
  </style>
</head>

<body>
  <div class="audio-control">
    <button id="audioToggle" type="button">开启声波识别</button>
    <span id="audioStatus">未开启</span>
  </div>
  <canvas id="particleSphere"></canvas>

  <script>
    const canvas = document.getElementById("particleSphere");
    const ctx = canvas.getContext("2d");
    const audioToggle = document.getElementById("audioToggle");
    const audioStatus = document.getElementById("audioStatus");

    const config = {
      particleCount: 1200,
      sphereRadius: 150,
      dotMinSize: 0.28,
      dotMaxSize: 0.42,
      rotateSpeedX: 0.00016,
      rotateSpeedY: 0.00027,
      perspective: 500,

      breathStrength: 0.038,
      breathSpeed: 0.00125,

      enterDuration: 2000,
      enterSpread: 3.8,

      rimBoost: 0.34
    };

    let width = 0;
    let height = 0;
    let centerX = 0;
    let centerY = 0;
    let startTime = performance.now();
    let particles = [];
    let transientRings = [];
    let nextTransientRingTime = 0;
    let shapeMorph = {
      active: false,
      start: 0,
      duration: 1600,
      ringsEnabled: true,
      targetIsSphere: true,
      rotateDuringMorph: false
    };
    let rotationState = {
      angleX: 0,
      angleY: 0,
      blend: 1,
      lastUpdate: performance.now(),
      resumeStart: 0,
      resumeDuration: 720,
      resuming: false
    };
    let ringState = {
      visibility: 0,
      lastUpdate: performance.now()
    };
    let audioControl = {
      active: false,
      controlling: false,
      audioContext: null,
      analyser: null,
      mediaStream: null,
      source: null,
      timeData: null,
      freqData: null,
      cloud: null,
      level: 0,
      smoothLevel: 0,
      lastSound: 0,
      threshold: 0.035,
      lostTimeout: 620,
      smoothing: 0.22
    };
    let audioTransition = {
      active: false,
      type: "",
      start: 0,
      duration: 0
    };
    let audioMode = "sphere";
    let lineParticles = [];
    const transitionTiming = {
      lineToSphereDuration: 860,
      sphereToLineDuration: 760,
      sphereToLineSphereExitEnd: 0.44,
      sphereToLineLineEnterStart: 0.34,
      lineToSphereLineExitEnd: 0.44,
      lineToSphereSphereEnterStart: 0.34
    };

    function resize() {
      const dpr = Math.min(window.devicePixelRatio || 1, 2);

      width = window.innerWidth;
      height = window.innerHeight;

      canvas.width = width * dpr;
      canvas.height = height * dpr;

      canvas.style.width = width + "px";
      canvas.style.height = height + "px";

      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

      centerX = width / 2;
      centerY = height / 2;

      config.sphereRadius = Math.min(width, height) * 0.1;
    }

    function createSphereParticles() {
      particles = [];

      const goldenAngle = Math.PI * (3 - Math.sqrt(5));

      for (let i = 0; i < config.particleCount; i++) {
        const y = 1 - (i / (config.particleCount - 1)) * 2;
        const radius = Math.sqrt(1 - y * y);
        const theta = goldenAngle * i;

        const x = Math.cos(theta) * radius;
        const z = Math.sin(theta) * radius;

        particles.push({
          x,
          y,
          z,
          shapeX: x,
          shapeY: y,
          shapeZ: z,
          fromX: x,
          fromY: y,
          fromZ: z,
          toX: x,
          toY: y,
          toZ: z,
          seed: Math.random(),
          enterOffset: Math.random() * 0.35,
          twinkleSpeed: 0.00075 + Math.random() * 0.00075
        });
      }
    }

    function createAudioLineParticles() {
      lineParticles = [];

      for (let i = 0; i < config.particleCount; i++) {
        const t = config.particleCount <= 1 ? 0 : i / (config.particleCount - 1);

        lineParticles.push({
          x: -1 + t * 2,
          y: 0,
          z: 0,
          seed: Math.random(),
          twinkleSpeed: 0.00075 + Math.random() * 0.00075
        });
      }
    }

    function easeOutCubic(t) {
      return 1 - Math.pow(1 - t, 3);
    }

    function easeInOutCubic(t) {
      return t < 0.5
        ? 4 * t * t * t
        : 1 - Math.pow(-2 * t + 2, 3) / 2;
    }

    function easeOutBack(t) {
      const c1 = 1.70158;
      const c3 = c1 + 1;
      return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2);
    }

    function normalizeShapePoint(point, options = {}) {
      const scale = options.scale ?? 1;
      const defaultZ = options.defaultZ ?? 0;
      let x = 0;
      let y = 0;
      let z = defaultZ;

      if (Array.isArray(point)) {
        x = Number(point[0]) || 0;
        y = Number(point[1]) || 0;
        z = point.length > 2 ? (Number(point[2]) || 0) : defaultZ;
      } else if (point && typeof point === "object") {
        x = Number(point.x) || 0;
        y = Number(point.y) || 0;
        z = point.z == null ? defaultZ : (Number(point.z) || 0);
      }

      return {
        x: x * scale,
        y: y * scale,
        z: z * scale
      };
    }

    function normalizePointCloud(points, options = {}) {
      const normalized = points.map((point) => normalizeShapePoint(point, options));

      if (!normalized.length) return [];

      let minX = Infinity;
      let minY = Infinity;
      let minZ = Infinity;
      let maxX = -Infinity;
      let maxY = -Infinity;
      let maxZ = -Infinity;

      for (const p of normalized) {
        if (p.x < minX) minX = p.x;
        if (p.y < minY) minY = p.y;
        if (p.z < minZ) minZ = p.z;
        if (p.x > maxX) maxX = p.x;
        if (p.y > maxY) maxY = p.y;
        if (p.z > maxZ) maxZ = p.z;
      }

      const centerX = (minX + maxX) / 2;
      const centerY = (minY + maxY) / 2;
      const centerZ = (minZ + maxZ) / 2;

      const spanX = maxX - minX;
      const spanY = maxY - minY;
      const spanZ = maxZ - minZ;
      const maxSpan = Math.max(spanX, spanY, spanZ, 1e-6);

      // 原始圆球的标准坐标范围是 -1 到 1，直径跨度为 2。
      // 所有自定义形态统一归一化到最大跨度 2，保证整体尺寸和原圆球一致。
      const fit = options.fit ?? 2;
      const fitScale = fit / maxSpan;

      // 双模式：
      // 1) 优先真实 3D：输入本身有明显 z 深度时，直接保留真实 3D。
      // 2) 兼容 2D：输入基本无 z 深度时，自动补 z 深度形成立体点阵。
      const auto3D = options.auto3D ?? true;
      const depth = options.depth ?? 0.62;
      const preferTrue3D = options.preferTrue3D ?? true;
      const hasInputDepth = spanZ > maxSpan * 0.035;

      return normalized.map((p, index) => {
        const x = (p.x - centerX) * fitScale;
        const y = (p.y - centerY) * fitScale;
        let z = (p.z - centerZ) * fitScale;

        if (auto3D && (!hasInputDepth || !preferTrue3D)) {
          const noiseA = Math.sin(index * 12.9898 + 4.1414) * 43758.5453;
          const noiseB = Math.sin(index * 78.233 + 9.173) * 24634.6345;
          const randomA = noiseA - Math.floor(noiseA);
          const randomB = noiseB - Math.floor(noiseB);

          const halfFit = Math.max(fit * 0.5, 1e-6);
          const radial = Math.min(1, Math.hypot(x, y) / halfFit);
          const dome = Math.sqrt(Math.max(0, 1 - radial * radial));

          const innerLayerDepth = (randomA - 0.5) * depth * 0.58;
          const surfaceDepth = (randomB > 0.5 ? 1 : -1) * dome * depth * 0.42;

          z += innerLayerDepth + surfaceDepth;
        }

        return {
          x,
          y,
          z
        };
      });
    }


    function normalizeSignedDistance(value) {
      if (typeof value === "boolean") return value;
      return Number(value) <= 0;
    }

    function buildVolumePointCloud(options = {}) {
      if (typeof options.volumeGenerator !== "function") {
        throw new Error("setParticleShape3D 需要传入 volumeGenerator 函数。");
      }

      const count = particles.length;
      const resolution = Math.max(8, Math.min(48, Number(options.resolution) || 28));
      const points = [];
      const candidates = [];

      for (let ix = 0; ix < resolution; ix++) {
        const x = -1 + (ix / (resolution - 1)) * 2;

        for (let iy = 0; iy < resolution; iy++) {
          const y = -1 + (iy / (resolution - 1)) * 2;

          for (let iz = 0; iz < resolution; iz++) {
            const z = -1 + (iz / (resolution - 1)) * 2;
            const inside = normalizeSignedDistance(
              options.volumeGenerator(x, y, z, { ix, iy, iz, resolution })
            );

            if (!inside) continue;

            const shellOnly = options.shellOnly ?? false;
            if (shellOnly) {
              const e = 2 / Math.max(1, resolution - 1);
              const neighborInside =
                normalizeSignedDistance(options.volumeGenerator(x + e, y, z, { ix, iy, iz, resolution })) &&
                normalizeSignedDistance(options.volumeGenerator(x - e, y, z, { ix, iy, iz, resolution })) &&
                normalizeSignedDistance(options.volumeGenerator(x, y + e, z, { ix, iy, iz, resolution })) &&
                normalizeSignedDistance(options.volumeGenerator(x, y - e, z, { ix, iy, iz, resolution })) &&
                normalizeSignedDistance(options.volumeGenerator(x, y, z + e, { ix, iy, iz, resolution })) &&
                normalizeSignedDistance(options.volumeGenerator(x, y, z - e, { ix, iy, iz, resolution }));

              if (neighborInside) continue;
            }

            candidates.push({ x, y, z });
          }
        }
      }

      if (!candidates.length) {
        throw new Error("volumeGenerator 没有生成任何 3D 点。");
      }

      for (let i = 0; i < count; i++) {
        const source = candidates[Math.floor((i / count) * candidates.length) % candidates.length];
        points.push({
          x: source.x,
          y: source.y,
          z: source.z
        });
      }

      return normalizePointCloud(points, options);
    }

    function setParticleShape3D(options = {}) {
      let cloud = null;

      if (Array.isArray(options.points3D) && options.points3D.length > 0) {
        cloud = normalizePointCloud(options.points3D, options);
      } else if (typeof options.generator3D === "function") {
        const generated = [];
        for (let i = 0; i < particles.length; i++) {
          generated.push(options.generator3D(i, particles.length, options));
        }
        cloud = normalizePointCloud(generated, options);
      } else if (typeof options.volumeGenerator === "function") {
        cloud = buildVolumePointCloud(options);
      } else {
        throw new Error("setParticleShape3D 需要传入 points3D、generator3D 或 volumeGenerator。");
      }

      applyTargetCloud(cloud, options.duration, false);
    }

    function getSphereShapePoint(index, count) {
      const goldenAngle = Math.PI * (3 - Math.sqrt(5));
      const y = 1 - (index / (count - 1)) * 2;
      const radius = Math.sqrt(Math.max(0, 1 - y * y));
      const theta = goldenAngle * index;

      return {
        x: Math.cos(theta) * radius,
        y,
        z: Math.sin(theta) * radius
      };
    }

    function buildShapeCloud(options = {}) {
      const count = particles.length;

      if (
        Array.isArray(options.points3D) ||
        typeof options.generator3D === "function" ||
        typeof options.volumeGenerator === "function"
      ) {
        if (Array.isArray(options.points3D) && options.points3D.length > 0) {
          return normalizePointCloud(options.points3D, options);
        }

        if (typeof options.generator3D === "function") {
          const generated = [];
          for (let i = 0; i < count; i++) {
            generated.push(options.generator3D(i, count, options));
          }
          return normalizePointCloud(generated, options);
        }

        return buildVolumePointCloud(options);
      }

      if (typeof options.generator === "function") {
        const generated = [];
        for (let i = 0; i < count; i++) {
          generated.push(options.generator(i, count, options));
        }
        return normalizePointCloud(generated, options);
      }

      if (Array.isArray(options.points) && options.points.length > 0) {
        return normalizePointCloud(options.points, options);
      }

      throw new Error("setParticleShape 需要传入 points / generator（二维轮廓可自动补 z 深度）或 points3D / generator3D / volumeGenerator（优先真实 3D）。");
    }

    function applyTargetCloud(cloud, duration = 1600, ringsEnabledAfterMorph = false, options = {}) {
      const now = performance.now();
      const rotateDuringMorph = options.rotateDuringMorph ?? false;

      updateRotationState(now, shouldRenderSphereRotation() || rotateDuringMorph);

      if (rotateDuringMorph) {
        rotationState.blend = 1;
        rotationState.resuming = false;
        rotationState.lastUpdate = now;
      }

      const currentMorphProgress = getShapeMorphProgress(now);
      const currentVisiblePoints = particles.map((p) => {
        const current = getCurrentVisiblePoint(p, now, currentMorphProgress);

        return rotateDuringMorph
          ? inverseRotatePointByAngles(current, rotationState.angleX, rotationState.angleY)
          : current;
      });

      shapeMorph = {
        active: true,
        start: now,
        duration: Math.max(120, Number(duration) || 1600),
        ringsEnabled: ringsEnabledAfterMorph,
        targetIsSphere: ringsEnabledAfterMorph,
        rotateDuringMorph
      };

      transientRings = [];
      nextTransientRingTime = now + shapeMorph.duration + 420;

      for (let i = 0; i < particles.length; i++) {
        const p = particles[i];
        const target = cloud[i % cloud.length];
        const current = currentVisiblePoints[i];

        p.shapeX = current.x;
        p.shapeY = current.y;
        p.shapeZ = current.z;

        p.fromX = current.x;
        p.fromY = current.y;
        p.fromZ = current.z;

        p.toX = target.x;
        p.toY = target.y;
        p.toZ = target.z;
      }
    }

    function setParticleShape(options = {}) {
      const cloud = buildShapeCloud(options);
      applyTargetCloud(cloud, options.duration, false);
    }

    function buildSphereCloud() {
      const sphereCloud = [];

      for (let i = 0; i < particles.length; i++) {
        sphereCloud.push(getSphereShapePoint(i, particles.length));
      }

      return sphereCloud;
    }

    function resetParticleSphere(duration = 1600, options = {}) {
      const now = options.now ?? performance.now();
      const sphereCloud = buildSphereCloud();
      const rotateDuringMorph = options.rotateDuringMorph ?? options.visual ?? false;

      if (rotateDuringMorph) {
        rotationState.blend = 1;
        rotationState.resuming = false;
        rotationState.lastUpdate = now;
      }

      applyTargetCloud(sphereCloud, duration, true, {
        rotateDuringMorph
      });
    }

    function getShapeMorphProgress(now) {
      if (!shapeMorph.active) return 1;

      const progress = clamp01((now - shapeMorph.start) / shapeMorph.duration);

      if (progress >= 1) {
        const targetIsSphere = shapeMorph.targetIsSphere;

        for (const p of particles) {
          p.shapeX = p.toX;
          p.shapeY = p.toY;
          p.shapeZ = p.toZ;
        }

        const rotateDuringMorph = shapeMorph.rotateDuringMorph;
        shapeMorph.active = false;
        shapeMorph.rotateDuringMorph = false;

        if (targetIsSphere) {
          if (rotateDuringMorph) {
            rotationState.blend = 1;
            rotationState.resuming = false;
            rotationState.lastUpdate = now;
          } else {
            startRotationResume(now, 720);
          }
        }

        return 1;
      }

      return easeOutCubic(progress);
    }

    function getParticleShapePoint(p, morphProgress) {
      if (!shapeMorph.active) {
        return {
          x: p.shapeX,
          y: p.shapeY,
          z: p.shapeZ
        };
      }

      return {
        x: p.fromX + (p.toX - p.fromX) * morphProgress,
        y: p.fromY + (p.toY - p.fromY) * morphProgress,
        z: p.fromZ + (p.toZ - p.fromZ) * morphProgress
      };
    }

    function clamp01(value) {
      return Math.min(Math.max(value, 0), 1);
    }

    function shouldRenderSphereRotation() {
      return shapeMorph.ringsEnabled && (!shapeMorph.active || shapeMorph.rotateDuringMorph);
    }

    function startRotationResume(now, duration = 720) {
      rotationState.resuming = true;
      rotationState.resumeStart = now;
      rotationState.resumeDuration = Math.max(120, Number(duration) || 720);
      rotationState.blend = 0;
    }

    function updateRotationState(now, enabled) {
      const dt = Math.min(Math.max(now - rotationState.lastUpdate, 0), 48);
      rotationState.lastUpdate = now;

      if (!enabled) {
        rotationState.blend = 0;
        rotationState.resuming = false;
        return;
      }

      if (rotationState.resuming) {
        const progress = clamp01((now - rotationState.resumeStart) / rotationState.resumeDuration);
        rotationState.blend = easeOutCubic(progress);

        if (progress >= 1) {
          rotationState.resuming = false;
          rotationState.blend = 1;
        }
      } else {
        rotationState.blend = 1;
      }

      rotationState.angleX += dt * config.rotateSpeedX * rotationState.blend;
      rotationState.angleY += dt * config.rotateSpeedY * rotationState.blend;
    }

    function rotatePointByAngles(p, angleX, angleY) {
      const cosY = Math.cos(angleY);
      const sinY = Math.sin(angleY);
      const cosX = Math.cos(angleX);
      const sinX = Math.sin(angleX);

      const x1 = p.x * cosY - p.z * sinY;
      const z1 = p.x * sinY + p.z * cosY;

      const y2 = p.y * cosX - z1 * sinX;
      const z2 = p.y * sinX + z1 * cosX;

      return {
        x: x1,
        y: y2,
        z: z2
      };
    }

    function inverseRotatePointByAngles(p, angleX, angleY) {
      const cosY = Math.cos(angleY);
      const sinY = Math.sin(angleY);
      const cosX = Math.cos(angleX);
      const sinX = Math.sin(angleX);

      const y1 = p.y * cosX + p.z * sinX;
      const z1 = -p.y * sinX + p.z * cosX;

      const x = p.x * cosY + z1 * sinY;
      const z = -p.x * sinY + z1 * cosY;

      return {
        x,
        y: y1,
        z
      };
    }

    function rotatePointWithState(p) {
      const rotated = rotatePointByAngles(p, rotationState.angleX, rotationState.angleY);
      const blend = clamp01(rotationState.blend);

      if (blend <= 0) return p;
      if (blend >= 1) return rotated;

      const eased = easeOutCubic(blend);

      return {
        x: p.x + (rotated.x - p.x) * eased,
        y: p.y + (rotated.y - p.y) * eased,
        z: p.z + (rotated.z - p.z) * eased
      };
    }

    function getSphereWaveScale(point, now, seed) {
      const waveAngle = Math.atan2(point.y, point.x);
      const surfaceBand = Math.acos(Math.max(-1, Math.min(1, point.z)));

      const wholeSphereWave =
        Math.sin(waveAngle * 3.0 + surfaceBand * 1.6 + now * 0.0010 + seed * 5.0) * 0.055 +
        Math.sin(waveAngle * 5.0 - surfaceBand * 2.2 - now * 0.00072 + seed * 3.4) * 0.032 +
        Math.sin(waveAngle * 8.0 + now * 0.00045 + seed * 7.2) * 0.014;

      const planarRadius = Math.hypot(point.x, point.y);
      const deformationStrength = 0.42 + Math.pow(planarRadius, 1.35) * 0.78;

      return 1 + wholeSphereWave * deformationStrength;
    }

    function getCurrentVisiblePoint(p, now, morphProgress) {
      const shapedPoint = getParticleShapePoint(p, morphProgress);

      if (!shouldRenderSphereRotation()) {
        return shapedPoint;
      }

      const rotated = rotatePointWithState(shapedPoint);
      const waveScale = getSphereWaveScale(rotated, now, p.seed);

      return {
        x: rotated.x * waveScale,
        y: rotated.y * waveScale,
        z: rotated.z
      };
    }

    function getRingVisibility(now) {
      const target = shapeMorph.ringsEnabled && !shapeMorph.active ? 1 : 0;
      const dt = Math.min(Math.max(now - ringState.lastUpdate, 0), 80);
      ringState.lastUpdate = now;

      const speed = target > ringState.visibility ? 0.0075 : 0.012;
      const step = Math.min(1, dt * speed);

      ringState.visibility += (target - ringState.visibility) * step;

      if (Math.abs(target - ringState.visibility) < 0.002) {
        ringState.visibility = target;
      }

      return ringState.visibility;
    }

    function seededRandom(index, salt = 0) {
      const x = Math.sin(index * 12.9898 + salt * 78.233) * 43758.5453;
      return x - Math.floor(x);
    }

    function getAudioRms(timeData) {
      let sum = 0;

      for (let i = 0; i < timeData.length; i++) {
        const value = (timeData[i] - 128) / 128;
        sum += value * value;
      }

      return Math.sqrt(sum / Math.max(1, timeData.length));
    }

    function getAudioLinePoint(index, count) {
      const t = count <= 1 ? 0 : index / (count - 1);

      return {
        x: -1 + t * 2,
        y: 0,
        z: 0
      };
    }

    function startAudioShapeTransition(type, duration) {
      const now = performance.now();

      audioTransition = {
        active: true,
        type,
        start: now,
        duration: Math.max(120, Number(duration) || 760)
      };

      transientRings = [];
      nextTransientRingTime = now + 520;

      if (type === "sphereToLine") {
        audioMode = "transitionToLine";
      } else if (type === "lineToSphere") {
        audioMode = "transitionToSphere";
      }
    }

    function completeAudioTransitionIfNeeded(now) {
      if (!audioTransition.active) return;

      const progress = clamp01((now - audioTransition.start) / audioTransition.duration);

      if (progress < 1) return;

      if (audioTransition.type === "sphereToLine") {
        audioMode = "line";
        audioControl.controlling = true;
        audioStatus.textContent = "声波显示中";
      }

      if (audioTransition.type === "lineToSphere") {
        audioMode = "sphere";
        audioControl.active = false;
        audioControl.controlling = false;
        audioControl.cloud = null;
        audioStatus.textContent = "已关闭";
      }

      audioTransition.active = false;
      audioTransition.type = "";
      audioTransition.duration = 0;
    }

    function getAudioTransitionProgress(now) {
      if (!audioTransition.active) return 1;
      return clamp01((now - audioTransition.start) / audioTransition.duration);
    }

    function getSphereAudioVisual(now) {
      if (!audioTransition.active) {
        return audioMode === "sphere"
          ? { alpha: 1, scale: 1, ringAlpha: 1 }
          : { alpha: 0, scale: 0.92, ringAlpha: 0 };
      }

      const progress = getAudioTransitionProgress(now);

      if (audioTransition.type === "sphereToLine") {
        const sphereExitEnd = transitionTiming.sphereToLineSphereExitEnd;
        const t = clamp01(progress / sphereExitEnd);
        const eased = easeOutCubic(t);

        return {
          alpha: 1 - eased,
          scale: 1 - eased * 0.16,
          ringAlpha: 1 - eased
        };
      }

      if (audioTransition.type === "lineToSphere") {
        const sphereEnterStart = transitionTiming.lineToSphereSphereEnterStart;
        const t = clamp01((progress - sphereEnterStart) / (1 - sphereEnterStart));
        const eased = easeOutCubic(t);

        return {
          alpha: eased,
          scale: 0.84 + eased * 0.16,
          ringAlpha: eased
        };
      }

      return { alpha: 1, scale: 1, ringAlpha: 1 };
    }

    function getLineAudioVisual(now) {
      if (!audioTransition.active) {
        return audioMode === "line"
          ? { alpha: 1, scaleX: 1, reveal: 1 }
          : { alpha: 0, scaleX: 0, reveal: 0 };
      }

      const progress = getAudioTransitionProgress(now);

      if (audioTransition.type === "sphereToLine") {
        const lineEnterStart = transitionTiming.sphereToLineLineEnterStart;
        const t = clamp01((progress - lineEnterStart) / (1 - lineEnterStart));
        const eased = easeOutCubic(t);

        return {
          alpha: eased,
          scaleX: eased,
          reveal: eased
        };
      }

      if (audioTransition.type === "lineToSphere") {
        const lineExitEnd = transitionTiming.lineToSphereLineExitEnd;
        const t = clamp01(progress / lineExitEnd);
        const eased = easeOutCubic(t);

        return {
          alpha: 1 - eased,
          scaleX: 1 - eased,
          reveal: 1 - eased
        };
      }

      return { alpha: 0, scaleX: 0, reveal: 0 };
    }

    function drawAudioLineParticles(now, visual, baseScale) {
      if (!lineParticles.length || visual.alpha <= 0.01 || visual.reveal <= 0.01) return;

      const radius = config.sphereRadius * baseScale;
      const reveal = clamp01(visual.reveal);
      const scaleX = clamp01(visual.scaleX);

      for (const p of lineParticles) {
        const centerDistance = Math.abs(p.x);
        if (centerDistance > reveal) continue;

        const localReveal = clamp01((reveal - centerDistance) / Math.max(0.001, reveal));
        const flicker = 0.91 + Math.sin(now * p.twinkleSpeed + p.seed * 12.0) * 0.09;
        const x = centerX + p.x * radius * scaleX;
        const y = centerY;

        const size =
          (config.dotMinSize + (config.dotMaxSize - config.dotMinSize) * 0.72) *
          (0.88 + localReveal * 0.18);

        const alpha =
          (0.38 + localReveal * 0.52) *
          visual.alpha *
          flicker;

        if (alpha <= 0.01 || size <= 0.1) continue;
        drawParticle(x, y, size, Math.min(1, alpha), 0, 0.5);
      }
    }

    function getSmoothAudioSample(buffer, position) {
      const maxIndex = buffer.length - 1;
      const index = Math.max(0, Math.min(maxIndex, Math.floor(position * maxIndex)));
      const prev = buffer[Math.max(0, index - 1)];
      const current = buffer[index];
      const next = buffer[Math.min(maxIndex, index + 1)];
      return (prev + current * 2 + next) / 4;
    }

    function buildAudioWavePointCloud(count, options = {}) {
      if (audioControl.analyser && audioControl.timeData) {
        audioControl.analyser.getByteTimeDomainData(audioControl.timeData);

        const rawLevel = getAudioRms(audioControl.timeData);
        audioControl.level = rawLevel;
        audioControl.smoothLevel += (rawLevel - audioControl.smoothLevel) * 0.18;
      }

      const points = [];

      for (let i = 0; i < count; i++) {
        const t = count <= 1 ? 0 : i / (count - 1);

        points.push(getAudioLinePoint(i, count));
      }

      return normalizePointCloud(points, {
        fit: 2,
        auto3D: false,
        preferTrue3D: true,
        depth: 0.32
      });
    }

    function updateAudioAnalysis(now) {
      if (!audioControl.active || audioTransition.active) return;

      if (audioControl.analyser && audioControl.timeData) {
        audioControl.analyser.getByteTimeDomainData(audioControl.timeData);

        const rawLevel = getAudioRms(audioControl.timeData);
        audioControl.level = rawLevel;
        audioControl.smoothLevel += (rawLevel - audioControl.smoothLevel) * 0.18;
      }

      audioControl.controlling = true;

      const shownLevel = Math.max(audioControl.smoothLevel || 0, 0.01);
      audioStatus.textContent = `声波显示中 ${Math.round(shownLevel * 1000)}`;
    }

    function applyLiveAudioCloud() {
      return;
    }

    function setAudioWaveShape(options = {}) {
      audioControl.smoothLevel = options.level ?? 0.12;
      audioControl.cloud = buildAudioWavePointCloud(particles.length, {
        level: audioControl.smoothLevel
      });
      audioControl.active = true;
      audioControl.controlling = false;
      startAudioShapeTransition("sphereToLine", options.duration ?? transitionTiming.sphereToLineDuration);
    }

    async function startAudioWaveControl() {
      if (audioControl.active || audioTransition.active) return;

      audioControl.active = true;
      audioControl.controlling = false;
      audioControl.cloud = null;
      audioControl.level = 0;
      audioControl.smoothLevel = 0.08;
      audioControl.lastSound = 0;

      audioToggle.classList.add("active");
      audioToggle.textContent = "关闭声波识别";
      audioStatus.textContent = "声波切换中";

      startAudioShapeTransition("sphereToLine", transitionTiming.sphereToLineDuration);
    }

    function stopAudioWaveControl() {
      if (!audioControl.active && !audioTransition.active && audioMode !== "line") return;

      const shouldExitLine =
        audioControl.controlling ||
        audioTransition.active ||
        audioMode === "line" ||
        audioMode === "transitionToLine";

      audioControl.active = false;
      audioControl.controlling = false;
      audioControl.cloud = null;
      audioControl.level = 0;
      audioControl.smoothLevel = 0;
      audioControl.lastSound = 0;

      audioToggle.classList.remove("active");
      audioToggle.textContent = "开启声波识别";

      if (shouldExitLine) {
        audioStatus.textContent = "恢复默认";
        startAudioShapeTransition("lineToSphere", transitionTiming.lineToSphereDuration);
      } else {
        audioStatus.textContent = "已关闭";
      }
    }

    async function toggleAudioWaveControl() {
      try {
        if (audioControl.active) {
          stopAudioWaveControl();
        } else {
          await startAudioWaveControl();
        }
      } catch (error) {
        audioControl.active = false;
        audioControl.controlling = false;
        audioControl.cloud = null;
        audioToggle.classList.remove("active");
        audioToggle.textContent = "开启声波识别";
        audioStatus.textContent = "开启失败";
        console.error(error);
      }
    }

    window.setParticleShape = setParticleShape;
    window.setParticleShape3D = setParticleShape3D;
    window.resetParticleSphere = resetParticleSphere;
    window.setAudioWaveShape = setAudioWaveShape;
    window.startAudioWaveControl = startAudioWaveControl;
    window.stopAudioWaveControl = stopAudioWaveControl;

    // 双模式支持：
    // 1. setParticleShape(...)
    //    - points / generator：支持二维轮廓，自动补 z 深度
    //    - points3D / generator3D / volumeGenerator：优先真实 3D
    //
    // 2. setParticleShape3D(...)
    //    - 专门用于真正 3D 点阵/体素点云
    //
    // 二维轮廓示例（自动补 z 深度）：
    // setParticleShape({
    //   duration: 1600,
    //   points: [{ x: -1, y: 0 }, { x: 0, y: 1 }, { x: 1, y: 0 }]
    // });
    //
    // 真 3D 体素示例：
    // setParticleShape3D({
    //   duration: 1600,
    //   resolution: 30,
    //   shellOnly: false,
    //   volumeGenerator: (x, y, z) => x * x + y * y + z * z - 0.55
    // });

    function rotatePoint(p, time) {
      const angleY = time * config.rotateSpeedY;
      const angleX = time * config.rotateSpeedX;

      const cosY = Math.cos(angleY);
      const sinY = Math.sin(angleY);
      const cosX = Math.cos(angleX);
      const sinX = Math.sin(angleX);

      let x = p.x;
      let y = p.y;
      let z = p.z;

      const x1 = x * cosY - z * sinY;
      const z1 = x * sinY + z * cosY;

      const y2 = y * cosX - z1 * sinX;
      const z2 = y * sinX + z1 * cosX;

      return {
        x: x1,
        y: y2,
        z: z2
      };
    }

    function drawWaveRing(now, baseRadius, phase, alpha, lineWidth) {
      const steps = 180;
      const squashY = 0.92;
      const spin = now * 0.00028 + phase * 0.15;

      ctx.beginPath();

      for (let i = 0; i <= steps; i++) {
        const t = (i / steps) * Math.PI * 2;
        const wave =
          Math.sin(t * 3 + now * 0.0011 + phase) * 0.065 +
          Math.sin(t * 5 - now * 0.0007 + phase * 1.7) * 0.028 +
          Math.sin(t * 8 + now * 0.00045 + phase * 0.6) * 0.012;

        const radius = baseRadius * (1 + wave);
        const angle = t + spin;

        const x = centerX + Math.cos(angle) * radius;
        const y = centerY + Math.sin(angle) * radius * squashY;

        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      }

      ctx.closePath();
      ctx.lineWidth = lineWidth;
      ctx.strokeStyle = `rgba(255, 255, 255, ${alpha})`;
      ctx.stroke();
    }

    function spawnTransientRing(now, baseRadius) {
      transientRings.push({
        start: now,
        life: 1050 + Math.random() * 1050,
        radiusScale: 0.96 + Math.random() * 0.16,
        phase: Math.random() * Math.PI * 2,
        alpha: 0.020 + Math.random() * 0.085,
        lineWidth: 0.45 + Math.random() * 0.45
      });
    }

    function updateTransientRings(now, baseRadius, enabled) {
      transientRings = transientRings.filter((ring) => now - ring.start < ring.life);

      if (!enabled) {
        nextTransientRingTime = now + 520;
        return;
      }

      if (nextTransientRingTime === 0) {
        nextTransientRingTime = now + 520;
      }

      if (now >= nextTransientRingTime) {
        const targetCount = 1 + Math.floor(Math.random() * 5);

        while (transientRings.length < targetCount && transientRings.length < 5) {
          spawnTransientRing(now, baseRadius);
        }

        nextTransientRingTime = now + 520 + Math.random() * 820;
      }
    }

    function drawTransientRings(now, baseRadius, globalAlpha) {
      for (const ring of transientRings) {
        const progress = Math.min(Math.max((now - ring.start) / ring.life, 0), 1);
        const fade = Math.sin(progress * Math.PI);
        const alpha = ring.alpha * fade * globalAlpha;

        if (alpha <= 0.002) continue;

        drawWaveRing(
          now,
          baseRadius * ring.radiusScale,
          ring.phase,
          alpha,
          ring.lineWidth
        );
      }
    }

    function drawSoftCore(radius, alpha) {
      const gradient = ctx.createRadialGradient(
        centerX,
        centerY,
        0,
        centerX,
        centerY,
        radius
      );

      gradient.addColorStop(0, `rgba(200, 200, 200, ${alpha * 0.10})`);
      gradient.addColorStop(0.42, `rgba(200, 200, 200, ${alpha * 0.035})`);
      gradient.addColorStop(1, "rgba(200, 200, 200, 0)");

      ctx.beginPath();
      ctx.arc(centerX, centerY, radius, 0, Math.PI * 2);
      ctx.fillStyle = gradient;
      ctx.fill();
    }

    function drawParticle(x, y, size, alpha, rim, front) {
      ctx.beginPath();
      ctx.arc(x, y, size, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(255, 255, 255, ${alpha})`;
      ctx.fill();
    }

    function animate(now) {
      ctx.clearRect(0, 0, width, height);

      const elapsed = now - startTime;

      const enterProgress = Math.min(elapsed / config.enterDuration, 1);
      const enterEase = easeOutCubic(enterProgress);

      const breath =
        1 + Math.sin(now * config.breathSpeed) * config.breathStrength;

      const impact =
        Math.sin(enterProgress * Math.PI) *
        0.09 *
        Math.pow(1 - enterProgress, 0.35);

      const baseScale = enterEase * breath * (1 + impact);
      const morphProgress = getShapeMorphProgress(now);
      completeAudioTransitionIfNeeded(now);

      updateAudioAnalysis(now);
      applyLiveAudioCloud();

      const sphereVisual = getSphereAudioVisual(now);
      const lineVisual = getLineAudioVisual(now);

      const sphereRotationEnabled = shouldRenderSphereRotation();

      updateRotationState(now, sphereRotationEnabled);

      const ringVisibility = getRingVisibility(now) * sphereVisual.ringAlpha;

      const sortedParticles = particles
        .map((p) => {
          const shapedPoint = getParticleShapePoint(p, morphProgress);
          const rotated = sphereRotationEnabled
            ? rotatePointWithState(shapedPoint)
            : shapedPoint;

          const depth = rotated.z;
          const perspectiveScale =
            config.perspective / (config.perspective - depth * config.sphereRadius);

          const enterDelay = Math.max(
            0,
            Math.min(1, (enterProgress - p.enterOffset) / (1 - p.enterOffset))
          );

          const localEnter = easeOutCubic(enterDelay);

          const spread = config.enterSpread - localEnter * (config.enterSpread - 1);
          const radius = config.sphereRadius * baseScale * spread * sphereVisual.scale;

          const x = centerX + rotated.x * radius * perspectiveScale;
          const y = centerY + rotated.y * radius * perspectiveScale;

          const front = (depth + 1) / 2;
          const rim = Math.pow(1 - Math.abs(depth), 2.8);

          const waveScale = sphereRotationEnabled
            ? getSphereWaveScale(rotated, now, p.seed)
            : 1;

          const px = centerX + rotated.x * radius * waveScale * perspectiveScale;
          const py = centerY + rotated.y * radius * waveScale * perspectiveScale;

          const flicker =
            0.91 + Math.sin(now * p.twinkleSpeed + p.seed * 12.0) * 0.09;

          const size =
            (config.dotMinSize +
              (config.dotMaxSize - config.dotMinSize) * front) *
            localEnter *
            (0.94 + front * 0.12);

          const alpha =
            (0.12 + front * 0.86 + rim * 0.06) *
            localEnter *
            sphereVisual.alpha *
            (0.88 + Math.sin(now * 0.002 + p.seed * 10) * 0.08);

          return {
            x: px,
            y: py,
            size,
            alpha: Math.min(1, alpha),
            z: depth,
            rim,
            front
          };
        })
        .sort((a, b) => a.z - b.z);

      const ringRadius = config.sphereRadius * baseScale * 1.05;
      const lineRevealProgress = Math.min(
        Math.max((elapsed - config.enterDuration) / 650, 0),
        1
      );
      const lineAlpha = easeOutCubic(lineRevealProgress);

      updateTransientRings(now, ringRadius, lineAlpha > 0.92 && ringVisibility > 0);

      if (lineAlpha > 0 && ringVisibility > 0) {
        drawWaveRing(now, ringRadius, 0.0, 0.14 * lineAlpha * ringVisibility, 1.1);
        drawWaveRing(now, ringRadius * 0.97, 1.7, 0.10 * lineAlpha * ringVisibility, 0.85);
      }

      drawTransientRings(now, ringRadius, lineAlpha * ringVisibility);

      for (const p of sortedParticles) {
        if (p.alpha <= 0.01 || p.size <= 0.1) continue;
        drawParticle(p.x, p.y, p.size, p.alpha, p.rim, p.front);
      }

      drawAudioLineParticles(now, lineVisual, baseScale);

      if (lineAlpha > 0 && ringVisibility > 0) {
        drawWaveRing(now, ringRadius * 1.01, 3.2, 0.08 * lineAlpha * ringVisibility, 0.7);
      }

      requestAnimationFrame(animate);
    }

    window.addEventListener("resize", resize);
    audioToggle.addEventListener("click", toggleAudioWaveControl);

    resize();
    createSphereParticles();
    createAudioLineParticles();
    requestAnimationFrame(animate);
  </script>
</body>
</html>
