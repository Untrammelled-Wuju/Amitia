<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>White Particle 3D Sphere Logo</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
      background: #000;
    }
  </style>
</head>

<body>
  <canvas id="particleSphere"></canvas>

  <script>
    const canvas = document.getElementById("particleSphere");
    const ctx = canvas.getContext("2d");

    const config = {
      particleCount: 380,
      sphereRadius: 150,
      dotMinSize: 0.75,
      dotMaxSize: 2.25,
      rotateSpeedX: 0.00016,
      rotateSpeedY: 0.00027,
      perspective: 540,

      breathStrength: 0.038,
      breathSpeed: 0.00125,

      enterDuration: 2000,
      enterSpread: 3.8,

      rimBoost: 0.34
    };

    let width = 0;
    let height = 0;
    let centerX = 0;
    let centerY = 0;
    let startTime = performance.now();
    let particles = [];

    function resize() {
      const dpr = Math.min(window.devicePixelRatio || 1, 2);

      width = window.innerWidth;
      height = window.innerHeight;

      canvas.width = width * dpr;
      canvas.height = height * dpr;

      canvas.style.width = width + "px";
      canvas.style.height = height + "px";

      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

      centerX = width / 2;
      centerY = height / 2;

      config.sphereRadius = Math.min(width, height) * 0.19;
    }

    function createSphereParticles() {
      particles = [];

      const goldenAngle = Math.PI * (3 - Math.sqrt(5));

      for (let i = 0; i < config.particleCount; i++) {
        const y = 1 - (i / (config.particleCount - 1)) * 2;
        const radius = Math.sqrt(1 - y * y);
        const theta = goldenAngle * i;

        const x = Math.cos(theta) * radius;
        const z = Math.sin(theta) * radius;

        particles.push({
          x,
          y,
          z,
          seed: Math.random(),
          enterOffset: Math.random() * 0.35,
          twinkleSpeed: 0.00075 + Math.random() * 0.00075
        });
      }
    }

    function easeOutCubic(t) {
      return 1 - Math.pow(1 - t, 3);
    }

    function easeOutBack(t) {
      const c1 = 1.70158;
      const c3 = c1 + 1;
      return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2);
    }

    function rotatePoint(p, time) {
      const angleY = time * config.rotateSpeedY;
      const angleX = time * config.rotateSpeedX;

      const cosY = Math.cos(angleY);
      const sinY = Math.sin(angleY);
      const cosX = Math.cos(angleX);
      const sinX = Math.sin(angleX);

      let x = p.x;
      let y = p.y;
      let z = p.z;

      const x1 = x * cosY - z * sinY;
      const z1 = x * sinY + z * cosY;

      const y2 = y * cosX - z1 * sinX;
      const z2 = y * sinX + z1 * cosX;

      return {
        x: x1,
        y: y2,
        z: z2
      };
    }

    function drawWaveRing(now, baseRadius, phase, alpha, lineWidth) {
      const steps = 180;
      const squashY = 0.92;
      const spin = now * 0.00028 + phase * 0.15;

      ctx.beginPath();

      for (let i = 0; i <= steps; i++) {
        const t = (i / steps) * Math.PI * 2;
        const wave =
          Math.sin(t * 3 + now * 0.0011 + phase) * 0.065 +
          Math.sin(t * 5 - now * 0.0007 + phase * 1.7) * 0.028 +
          Math.sin(t * 8 + now * 0.00045 + phase * 0.6) * 0.012;

        const radius = baseRadius * (1 + wave);
        const angle = t + spin;

        const x = centerX + Math.cos(angle) * radius;
        const y = centerY + Math.sin(angle) * radius * squashY;

        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      }

      ctx.closePath();
      ctx.lineWidth = lineWidth;
      ctx.strokeStyle = `rgba(255, 255, 255, ${alpha})`;
      ctx.stroke();
    }

    function drawSoftCore(radius, alpha) {
      const gradient = ctx.createRadialGradient(
        centerX,
        centerY,
        0,
        centerX,
        centerY,
        radius
      );

      gradient.addColorStop(0, `rgba(255, 255, 255, ${alpha * 0.10})`);
      gradient.addColorStop(0.42, `rgba(255, 255, 255, ${alpha * 0.035})`);
      gradient.addColorStop(1, "rgba(255, 255, 255, 0)");

      ctx.beginPath();
      ctx.arc(centerX, centerY, radius, 0, Math.PI * 2);
      ctx.fillStyle = gradient;
      ctx.fill();
    }

    function drawParticle(x, y, size, alpha, rim, front) {
      ctx.beginPath();
      ctx.arc(x, y, size, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(255, 255, 255, ${alpha})`;
      ctx.fill();
    }

    function animate(now) {
      ctx.clearRect(0, 0, width, height);

      const elapsed = now - startTime;

      const enterProgress = Math.min(elapsed / config.enterDuration, 1);
      const enterEase = easeOutCubic(enterProgress);

      const breath =
        1 + Math.sin(now * config.breathSpeed) * config.breathStrength;

      const impact =
        Math.sin(enterProgress * Math.PI) *
        0.09 *
        Math.pow(1 - enterProgress, 0.35);

      const baseScale = enterEase * breath * (1 + impact);

      const sortedParticles = particles
        .map((p) => {
          const rotated = rotatePoint(p, now);

          const depth = rotated.z;
          const perspectiveScale =
            config.perspective / (config.perspective - depth * config.sphereRadius);

          const enterDelay = Math.max(
            0,
            Math.min(1, (enterProgress - p.enterOffset) / (1 - p.enterOffset))
          );

          const localEnter = easeOutCubic(enterDelay);

          const spread = config.enterSpread - localEnter * (config.enterSpread - 1);
          const radius = config.sphereRadius * baseScale * spread;

          const x = centerX + rotated.x * radius * perspectiveScale;
          const y = centerY + rotated.y * radius * perspectiveScale;

          const front = (depth + 1) / 2;
          const rim = Math.pow(1 - Math.abs(depth), 2.8);

          const edgeAngle = Math.atan2(rotated.y, rotated.x);
          const edgeWave =
            Math.sin(edgeAngle * 4.0 + now * 0.00115 + p.seed * 6.0) * 0.05 +
            Math.sin(edgeAngle * 7.0 - now * 0.00075 + p.seed * 3.5) * 0.025;

          const edgeOffset = config.sphereRadius * rim * edgeWave * 0.6;
          const waveDirLen = Math.hypot(rotated.x, rotated.y) || 1;
          const waveDirX = rotated.x / waveDirLen;
          const waveDirY = rotated.y / waveDirLen;

          const px = x + waveDirX * edgeOffset * perspectiveScale;
          const py = y + waveDirY * edgeOffset * perspectiveScale;

          const flicker =
            0.91 + Math.sin(now * p.twinkleSpeed + p.seed * 12.0) * 0.09;

          const size =
            (config.dotMinSize +
              (config.dotMaxSize - config.dotMinSize) * front) *
            localEnter;

          const alpha =
            (0.16 + front * 0.78 + rim * 0.08) *
            localEnter *
            (0.88 + Math.sin(now * 0.002 + p.seed * 10) * 0.08);

          return {
            x: px,
            y: py,
            size,
            alpha: Math.min(1, alpha),
            z: depth,
            rim,
            front
          };
        })
        .sort((a, b) => a.z - b.z);

      const ringRadius = config.sphereRadius * baseScale * 1.02;
      drawWaveRing(now, ringRadius, 0.0, 0.18, 1.1);
      drawWaveRing(now, ringRadius * 0.97, 1.7, 0.10, 0.85);

      for (const p of sortedParticles) {
        if (p.alpha <= 0.01 || p.size <= 0.1) continue;
        drawParticle(p.x, p.y, p.size, p.alpha, p.rim, p.front);
      }

      drawWaveRing(now, ringRadius * 1.01, 3.2, 0.08, 0.7);

      requestAnimationFrame(animate);
    }

    window.addEventListener("resize", resize);

    resize();
    createSphereParticles();
    requestAnimationFrame(animate);
  </script>
</body>
</html>
