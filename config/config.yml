server:
  port: 1
  host: "127.0.0.1"
  mode: "debug"

storage:
  dataDir: "AmitiaData"

security:
  mode: "local_single_user"
  localToken: "2kUNkGYS8ZGb13sI2L7YXV7e9bZ3WGYiVxzBsBybErI"
  allowRemoteAccess: false
  localUserId: "1"
  allowedOrigins:
    - "app://amitia"
    - "http://127.0.0.1:18899"
    - "http://localhost:18899"

config:
  version: 2

app:
  name: "U-Ai"
  version: "26.2.0-beta.19"
  deployMode: "desktop-local"

chat:
  eventReplayRingSize: 4096
  contextWindowMaxRounds: 20
  agentTurnTimeoutSeconds: 0
  agentToolRepeatLimit: 0
  agentMaxParallelTools: 4
  agentMaxParallelTurns: 16

providers:
  scriptRuntime:
    enabled: true
    required: false
    provider: "builtin.node-process"
  vectorStore:
    enabled: true
    required: false
    provider: "builtin.qdrant-process"
    qdrant:
      host: "127.0.0.1"
      port: 0
      binaryPath: ""
      configDir: ""
      dataDir: ""
      snapshotsDir: ""
      collectionName: "amitia_vectors"
      vectorDim: 1536
      limit: 10
      collections: {}
  graphStore:
    enabled: true
    required: false
    provider: "builtin.surrealdb-process"
    surrealdb:
      host: "127.0.0.1"
      port: 0
      namespace: "uai"
      database: "memory_graph"
      username: "root"
      password: ""
      dataPath: "data/graph.db"
components:
  taskHost:
    enabled: true
    entryUri: ""
    workUri: ""

runtime:
  mode: "desktop"
  node:
    binaryPath: ""
    npmPath: ""
    npxPath: ""
    workDir: ""
  taskHost:
    enabled: true
    entryPath: ""
    workDir: ""

embedding:
  modelName: "text-embedding-3-small"
  baseUrl: ""
  apiKey: ""
