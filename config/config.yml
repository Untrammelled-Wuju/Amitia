server:
  port: 18899
  host: "127.0.0.1"
  mode: "debug"

storage:
  dataDir: "AmitiaData"

security:
  mode: "local_single_user"
  localToken: "2kUNkGYS8ZGb13sI2L7YXV7e9bZ3WGYiVxzBsBybErI"
  allowRemoteAccess: false
  localUserId: "1"
  allowedOrigins:
    - "app://amitia"
    - "http://127.0.0.1:18899"
    - "http://localhost:18899"

config:
  version: 2

app:
  name: "U-Ai"
  version: "26.2.0-beta.1"
  deployMode: "desktop-local"

chat:
  eventReplayRingSize: 4096
  contextWindowMaxRounds: 20

providers:
  scriptRuntime:
    enabled: true
    required: false
    provider: "builtin.node-process"
  vectorStore:
    enabled: true
    required: false
    provider: "builtin.qdrant-process"
    qdrant:
      host: "127.0.0.1"
      port: 19178
      binaryPath: ""
      configDir: ""
      dataDir: ""
      snapshotsDir: ""
      collectionName: "memory_embeddings"
      vectorDim: 1536
      limit: 10
      collections:
        memory_embeddings:
          name: "memory_embeddings"
          vectorDim: 1536
        working_memory:
          name: "working_memory"
          vectorDim: 1536
        user_profiles:
          name: "user_profiles"
          vectorDim: 1536
        episodic_memories:
          name: "episodic_memories"
          vectorDim: 1536
  graphStore:
    enabled: true
    required: false
    provider: "builtin.surrealdb-process"
    surrealdb:
      host: "127.0.0.1"
      port: 18000
      namespace: "uai"
      database: "memory_graph"
      username: "root"
      password: ""
      dataPath: "data/graph.db"
  search:
    enabled: false
    defaultProvider: "searxng"
    defaultLimit: 8
    maxLimit: 20
    timeoutSec: 10
    maxResponseBytes: 2097152
    cacheTtlSec: 120
    cacheMaxEntries: 512
    circuitFailures: 3
    circuitOpenSec: 30
    research:
      maxExecutionSec: 120
      maxToolOutputChars: 120000
      maxQueries: 4
      maxProvidersPerQuery: 2
      maxSearchResults: 12
      maxOpenPages: 4
      maxDeepOpenPages: 6
      maxDeepRounds: 3
      maxDeepSearchCalls: 12
      minDeepNewSources: 2
      maxParallelSearch: 4
      maxParallelFetch: 3
      searchTimeoutSec: 20
      fetchTimeoutSec: 20
      maxFetchBytes: 6291456
      maxPageChars: 60000
      maxEvidencePerPage: 12
      maxEvidenceChars: 3500
      referenceTtlHours: 168
      pageCacheTtlSec: 600
      autoBrowserEscalation: true
      minStaticContentChars: 240
      maxRedirects: 5
    providers:
      searxng:
        type: "searxng"
        endpoint: "http://127.0.0.1:8080"
        credentialRef: ""
        enabled: false
        priority: 100
        kinds: ["web", "news", "academic", "code", "image", "video"]
        allowHttp: true
        allowPrivate: true
      brave:
        type: "brave"
        endpoint: "https://api.search.brave.com/res/v1/web/search"
        credentialRef: ""
        enabled: false
        priority: 90
        kinds: ["web", "news"]
        allowHttp: false
        allowPrivate: false

components:
  taskHost:
    enabled: true
    entryUri: ""
    workUri: ""

runtime:
  mode: "desktop"
  node:
    binaryPath: ""
    npmPath: ""
    npxPath: ""
    workDir: ""
  taskHost:
    enabled: true
    entryPath: ""
    workDir: ""

embedding:
  modelName: "text-embedding-3-small"
  baseUrl: ""
  apiKey: ""
