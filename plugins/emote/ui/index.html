<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>表情包管理</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main class="emote-page">
    <input id="file-input" hidden type="file" multiple accept=".png,.jpg,.jpeg,.gif,.webp">
    <input id="folder-input" hidden type="file" multiple webkitdirectory accept=".png,.jpg,.jpeg,.gif,.webp">
    <section class="workspace">
      <aside class="groups" aria-label="表情分组">
        <button type="button" data-view="all" class="view-button active">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h6v6H4V4Zm10 0h6v6h-6V4ZM4 14h6v6H4v-6Zm10 0h6v6h-6v-6Z"/></svg>
          <span>全部表情</span>
        </button>
        <button type="button" data-view="recent" class="view-button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a9 9 0 1 1-8.5 6H1l3.5-4L8 9H5.7A7 7 0 1 0 12 5v-2Zm-1 5h2v4.4l3 1.8-1 1.7-4-2.4V8Z"/></svg>
          <span>最近使用</span>
        </button>
        <button type="button" data-view="unassigned" class="view-button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 3h14a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2Zm0 2v14h14V5H5Zm2.5 10 3-3 2.5 2.5 2-2 3.5 3.5h-11Zm2-6.5A1.75 1.75 0 1 1 9.5 12a1.75 1.75 0 0 1 0-3.5Z"/></svg>
          <span>未分组</span>
        </button>
        <div class="section-title">
          <span>自定义分组</span>
          <button type="button" class="el-button text circle" id="create-group" aria-label="新建分组">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5h2v6h6v2h-6v6h-2v-6H5v-2h6V5Z"/></svg>
          </button>
        </div>
        <div id="group-list"></div>
      </aside>

      <section class="list-panel" id="drop-zone">
        <div class="toolbar">
          <label class="el-input search-input">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 4a6 6 0 1 0 3.8 10.6l4.8 4.8 1.4-1.4-4.8-4.8A6 6 0 0 0 10 4Zm0 2a4 4 0 1 1 0 8 4 4 0 0 1 0-8Z"/></svg>
            <input id="search" placeholder="搜索名称、含义或关键词" autocomplete="off">
            <button type="button" id="clear-search" class="clear-button" hidden aria-label="清空搜索">×</button>
          </label>
          <select id="mobile-group-select" class="el-select mobile-group-select" aria-label="表情分类">
            <option value="view:all">全部表情</option>
            <option value="view:recent">最近使用</option>
            <option value="view:unassigned">未分组</option>
          </select>
          <button type="button" class="el-button" id="import-folder">导入文件夹</button>
          <button type="button" class="el-button primary" id="import-files">导入表情</button>
          <button type="button" class="el-button circle" id="refresh" aria-label="刷新">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17.7 6.3A8 8 0 1 0 20 12h-2a6 6 0 1 1-1.8-4.3L14 10h7V3l-3.3 3.3Z"/></svg>
          </button>
        </div>

        <div class="bulk" id="bulk" hidden>
          <span id="selected-count"></span>
          <select id="bulk-group" class="el-select"><option value="">加入分组</option></select>
          <button type="button" class="el-button" id="bulk-ai-on">允许 AI</button>
          <button type="button" class="el-button" id="bulk-ai-off">禁止 AI</button>
          <button type="button" class="el-button" id="bulk-remove-group" hidden>移出分组</button>
          <button type="button" class="el-button danger plain" id="bulk-delete">删除</button>
        </div>

        <div class="select-row">
          <label class="el-checkbox">
            <input type="checkbox" id="select-all">
            <span>全选当前页</span>
          </label>
          <span id="total">0 个表情</span>
        </div>
        <div class="grid" id="grid"></div>
      </section>

      <aside class="detail" id="detail"></aside>
    </section>
  </main>

  <dialog id="import-dialog" class="import-dialog">
    <div class="dialog-shell">
      <header class="dialog-header">
        <strong>导入预览</strong>
        <button type="button" class="el-button text circle" id="close-import" aria-label="关闭">×</button>
      </header>
      <div class="dialog-body">
        <section class="defaults">
          <div class="defaults-head">
            <strong>批量设置</strong>
            <span>填写后应用到全部表情</span>
          </div>
          <div class="defaults-row">
            <input id="default-meaning" class="el-input-native" placeholder="批量含义">
            <input id="default-keywords" class="el-input-native" placeholder="批量关键词（中文或英文逗号分隔）">
            <select id="default-group" class="el-select" multiple></select>
            <label class="el-switch"><input type="checkbox" id="default-ai"><span class="switch-track"></span><span>允许 AI</span></label>
            <button type="button" class="el-button" id="apply-defaults">应用到全部</button>
          </div>
        </section>
        <div class="import-list-head">
          <strong>待导入表情</strong>
          <span id="import-count">0 个文件</span>
        </div>
        <div class="import-list" id="import-list"></div>
      </div>
      <footer class="dialog-footer">
        <span id="import-footer-count">0 个待导入文件</span>
        <button type="button" class="el-button" id="cancel-import">取消</button>
        <button type="button" class="el-button primary" id="confirm-import">确认导入</button>
      </footer>
    </div>
  </dialog>

  <div class="toast" id="toast"></div>
  <script src="./index.js" defer></script>
</body>
</html>
