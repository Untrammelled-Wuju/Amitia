<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>发送表情</title>
  <link rel="stylesheet" href="./composer.css">
</head>
<body>
  <div class="wrap">
    <button class="emote-button" id="toggle" title="发送表情" aria-label="发送表情">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18Zm-3.2 6a1.2 1.2 0 1 1 0 2.4 1.2 1.2 0 0 1 0-2.4Zm6.4 0a1.2 1.2 0 1 1 0 2.4 1.2 1.2 0 0 1 0-2.4ZM7.2 14a5.4 5.4 0 0 0 9.6 0H7.2Z"/></svg>
    </button>
    <div class="panel hidden" id="panel">
      <div class="panel-head">
        <div>
          <strong>发送表情</strong>
          <span>选择一个表情加入当前对话</span>
        </div>
        <button type="button" id="mobile-back" class="close-button" aria-label="关闭">×</button>
      </div>
      <div class="head">
        <select id="group"><option value="">全部表情</option><option value="recent">最近使用</option></select>
        <label class="search-box">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 4a6 6 0 1 0 3.8 10.6l4.8 4.8 1.4-1.4-4.8-4.8A6 6 0 0 0 10 4Zm0 2a4 4 0 1 1 0 8 4 4 0 0 1 0-8Z"/></svg>
          <input id="search" placeholder="搜索表情">
        </label>
      </div>
      <div class="grid" id="grid"></div>
    </div>
  </div>
  <script src="./shell.js" defer></script>
  <script src="./composer.js" defer></script>
</body>
</html>
