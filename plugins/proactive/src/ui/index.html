<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>主动任务</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="proactive-shell">
      <header class="page-head">
        <div>
          <h1>主动任务</h1>
          <p id="subtitle">正在读取主动任务状态...</p>
        </div>
        <div class="head-actions">
          <button type="button" id="reset-presets">恢复预设</button>
          <button type="button" id="refresh">刷新</button>
        </div>
      </header>

      <div id="message" class="message" role="status" aria-live="polite"></div>
      <section id="metrics" class="metrics" aria-label="主动任务概况"></section>

      <section class="panel">
        <div class="panel-head">
          <div>
            <h2>主动任务总开关</h2>
            <p>关闭后当前角色停止执行所有主动任务规则。</p>
          </div>
          <label class="switch">
            <input id="master-enabled" type="checkbox" />
            <span class="switch-track"></span>
          </label>
        </div>
        <form id="settings-form">
          <div class="form-grid">
            <label>主动程度 <output id="active-level-value">40%</output>
              <input id="active-level" name="activeLevel" type="range" min="1" max="100" value="40" />
              <small>40 为默认程度；程度越高，任务之间的冷却时间越短。每日上限和免打扰仍生效。</small>
            </label>
            <label>最小间隔 <output id="min-interval-value">60 分钟</output>
              <input id="min-interval" name="minInterval" type="range" min="5" max="480" value="60" />
            </label>
            <label>每天最多主动任务 <output id="max-per-day-value">6 次</output>
              <input id="max-per-day" name="maxPerDay" type="range" min="1" max="24" value="6" />
            </label>
            <label>每天最多模型调用 <output id="max-daily-calls-value">10 次</output>
              <input id="max-daily-calls" name="maxDailyCalls" type="range" min="1" max="50" value="10" />
            </label>
            <label>静默开始
              <input id="quiet-start" name="quietStart" type="time" value="23:00" />
            </label>
            <label>静默结束
              <input id="quiet-end" name="quietEnd" type="time" value="07:00" />
            </label>
            <label>发送通道
              <select id="channel" name="channel">
                <option value="all">所属角色对话</option>
                <option value="web">Web</option>
                <option value="wechat">微信</option>
                <option value="qq">QQ</option>
              </select>
            </label>
            <label class="switch-line">
              <span>未回复时自动降频</span>
              <input id="unreplied-enabled" name="unrepliedSlowdownEnabled" type="checkbox" checked />
            </label>
          </div>
          <label>连续未回复次数<input id="unreplied-after" type="number" min="1" max="10" value="2" /></label>
          <label>未回复冷却倍数<input id="unreplied-multiplier" type="number" min="1" max="8" step="0.1" value="2" /></label>
          <label><input id="unreplied-recovery" type="checkbox" checked />回复后恢复</label>
          <div class="form-actions">
            <button type="submit" class="primary">保存全局参数</button>
          </div>
        </form>
      </section>

      <section class="panel">
        <div class="panel-head">
          <div>
            <h2>角色规则</h2>
            <p id="rule-summary">暂无规则</p>
          </div>
          <button type="button" id="add-rule" class="primary">新建规则</button>
        </div>
        <div id="rules" class="list"></div>
      </section>

      <section class="panel">
        <div class="panel-head">
          <div>
            <h2>最近运行</h2>
            <p>最近发生的发送与失败记录。</p>
          </div>
        </div>
        <div id="history" class="list"></div>
      </section>
    </main>

    <dialog id="rule-dialog" class="rule-dialog">
      <form id="rule-form">
        <header class="dialog-head">
          <div>
            <h2 id="rule-dialog-title">新建主动任务规则</h2>
            <p>时间使用本机时区。</p>
          </div>
          <button type="button" id="close-rule-dialog" class="icon-button" aria-label="关闭">关闭</button>
        </header>
        <div class="dialog-body">
          <input id="rule-id" type="hidden" />
          <div class="form-grid">
            <label>规则名称
              <input id="rule-name" name="name" required placeholder="例如：晚安提醒" />
            </label>
            <label>规则类型
              <select id="rule-type" name="ruleType">
                <option value="daily_greeting">每日问候</option>
                <option value="sleep_reminder">休息提醒</option>
                <option value="study_checkin">学习提醒</option>
                <option value="work_break">工作间歇</option>
                <option value="custom">自定义</option>
                <option value="cron">Cron</option>
              </select>
            </label>
            <label>Cron 时间
              <input id="rule-cron" name="scheduleCron" required value="0 9 * * *" placeholder="0 9 * * *" />
            </label>
            <label>发送通道
              <select id="rule-channel" name="channel">
                <option value="all">所属角色对话</option>
                <option value="web">Web</option>
                <option value="wechat">微信</option>
                <option value="qq">QQ</option>
              </select>
            </label>
            <label>静默开始
              <input id="rule-quiet-start" name="quietStart" type="time" value="23:00" />
            </label>
            <label>静默结束
              <input id="rule-quiet-end" name="quietEnd" type="time" value="07:00" />
            </label>
            <label>每天最多
              <input id="rule-max-per-day" name="maxPerDay" type="number" min="1" max="20" value="1" />
            </label>
            <label>随机偏移分钟
              <input id="rule-random-minutes" name="randomMinutes" type="number" min="0" max="180" value="0" />
            </label>
            <label>时区（IANA）<input id="rule-timezone" required value="Asia/Shanghai" /></label>
            <label class="wide">已接入渠道目标（JSON）<textarea id="rule-targets" rows="2" placeholder='[{"channelId":"wechat","peerId":"目标会话 ID"}]'>[]</textarea></label>
            <label>结束时间（含时区，可留空）<input id="rule-end" placeholder="2026-12-31T23:59:00+08:00" /></label>
            <label>最多执行次数（0 不限）<input id="rule-max-occurrences" type="number" min="0" value="0" /></label>
            <label><input id="rule-notification" type="checkbox" checked />系统通知</label>
            <label>目标对话 ID（留空新建）<input id="rule-conversation" /></label>
            <label class="wide">消息 Prompt
              <textarea id="rule-prompt" name="promptTemplate" rows="4" placeholder="描述希望角色如何发起这次主动任务"></textarea>
            </label>
          </div>
        </div>
        <footer class="dialog-actions">
          <button type="button" id="cancel-rule">取消</button>
          <button type="submit" class="primary">保存规则</button>
        </footer>
      </form>
    </dialog>

    <div id="toast" class="toast" aria-live="polite"></div>
    <script type="module" src="./app.js"></script>
  </body>
</html>
