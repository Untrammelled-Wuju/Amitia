server:
  port: 18899
  host: "127.0.0.1"
  mode: "debug"

storage:
  dataDir: "AmitiaData/data"

app:
  name: "U-Ai"
  version: "26.2.0-beta"
  deployMode: "desktop-local"

security:
  mode: "local_single_user"
  localToken: ""
  localTokenFile: "security/local-token"
  allowedOrigins:
    - "http://localhost:5178"
    - "http://127.0.0.1:5178"
    - "http://localhost:15177"
    - "http://127.0.0.1:15177"

providers:
  scriptRuntime:
    enabled: true
    required: false
    provider: "builtin.node-process"
  vectorStore:
    enabled: false
    required: false
    provider: "builtin.qdrant-process"
    qdrant:
      host: "127.0.0.1"
      port: 19178
      binaryPath: ""
      configDir: ""
      dataDir: ""
      snapshotsDir: ""
      resourceProfile: auto
      collectionName: "memory_embeddings"
      vectorDim: 1536
      limit: 10
      collections:
        memory_embeddings:
          name: "memory_embeddings"
          vectorDim: 1536
        working_memory:
          name: "working_memory"
          vectorDim: 1536
        user_profiles:
          name: "user_profiles"
          vectorDim: 1536
        episodic_memories:
          name: "episodic_memories"
          vectorDim: 1536
  graphStore:
    enabled: false
    required: false
    provider: "builtin.surrealdb-process"
    surrealdb:
      host: "127.0.0.1"
      port: 18000
      namespace: "uai"
      database: "memory_graph"
      username: "root"
      password: "root"
      dataPath: "surrealdb/data"

components:
  taskHost:
    enabled: true
    entryUri: ""
    workUri: ""

runtime:
  mode: "desktop"
  node:
    binaryPath: ""
    npmPath: ""
    npxPath: ""
    workDir: ""
  taskHost:
    enabled: true
    entryPath: ""
    workDir: ""

chat:
  mergeWindowMs: 6000
  contextWindowMaxRounds: 20

embedding:
  modelName: "text-embedding-3-small"
  baseUrl: ""
  apiKey: ""

desktopPetRuntime:
  enabled: true
