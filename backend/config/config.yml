server:
  port: 1
  host: "127.0.0.1"
  mode: "debug"

storage:
  dataDir: "AmitiaData/data"

app:
  name: "U-Ai"
  version: "26.2.0-beta.18"
  deployMode: "desktop-local"

security:
  mode: "local_single_user"
  localToken: ""
  localTokenFile: "security/local-token"
  allowedOrigins:
    - "http://localhost:5178"
    - "http://127.0.0.1:5178"
    - "http://localhost:15177"
    - "http://127.0.0.1:15177"

providers:
  scriptRuntime:
    enabled: true
    required: false
    provider: "builtin.node-process"
  vectorStore:
    enabled: false
    required: false
    provider: "builtin.qdrant-process"
    qdrant:
      host: "127.0.0.1"
      port: 1
      binaryPath: ""
      configDir: ""
      dataDir: ""
      snapshotsDir: ""
      resourceProfile: auto
      collectionName: "amitia_vectors"
      vectorDim: 1536
      limit: 10
      collections: {}
  graphStore:
    enabled: false
    required: false
    provider: "builtin.surrealdb-process"
    surrealdb:
      host: "127.0.0.1"
      port: 1
      namespace: "uai"
      database: "memory_graph"
      username: "root"
      password: "root"
      dataPath: "surrealdb/data"
components:
  taskHost:
    enabled: true
    entryUri: ""
    workUri: ""

runtime:
  mode: "desktop"
  node:
    binaryPath: ""
    npmPath: ""
    npxPath: ""
    workDir: ""
  taskHost:
    enabled: true
    entryPath: ""
    workDir: ""

chat:
  eventReplayRingSize: 4096
  contextWindowMaxRounds: 20
  agentTurnTimeoutSeconds: 0
  agentToolRepeatLimit: 0
  agentMaxParallelTools: 4
  agentMaxParallelTurns: 16

embedding:
  modelName: "text-embedding-3-small"
  baseUrl: ""
  apiKey: ""

desktopPetRuntime:
  enabled: true
