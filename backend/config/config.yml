server:
  port: 18899
  host: "127.0.0.1"
  mode: "debug"

storage:
  dataDir: "data"

jwt:
  secret: ""
  expireDays: 7

security:
  mode: "local_single_user"
  allowRemoteAccess: false
  localToken: ""
  allowedOrigins:
    - "app://amitia"
    - "http://127.0.0.1"
    - "http://localhost"

app:
  name: "U-Ai"
  version: "26.1.8"
  deployMode: "desktop-local"
chat:
  mergeWindowMs: 5000
  contextWindowMaxRounds: 20

qdrant:
  host: "127.0.0.1"
  port: 19178
  collectionName: "memory_embeddings"
  vectorDim: 1536
  limit: 10
  collections:
    memory_embeddings:
      name: "memory_embeddings"
      vectorDim: 1536
    working_memory:
      name: "working_memory"
      vectorDim: 1536
    user_profiles:
      name: "user_profiles"
      vectorDim: 1536
    episodic_memories:
      name: "episodic_memories"
      vectorDim: 1536
    amitia_emotes:
      name: "amitia_emotes"
      vectorDim: 1536

embedding:
  modelName: "text-embedding-3-small"
  baseUrl: ""
  apiKey: ""

surrealdb:
  host: "127.0.0.1"
  port: 18000
  namespace: "uai"
  database: "memory_graph"
  username: "root"
  password: "root"
  dataPath: "data/graph.db"

desktopPetRuntime:
  enabled: true
  path: "/internal/desktop-pet/runtime/ws"
  loopbackOnly: true
  allowRemote: false
  heartbeatIntervalMs: 10000
  heartbeatTimeoutMs: 30000
  maxMessageBytes: 1048576
  registerTimeoutSec: 10
  sendQueueSize: 64
  commandTimeoutSec: 30
  maxRetryAttempts: 5
  retryBaseDelayMs: 500
  retryMaxDelayMs: 30000
  commandRetentionHours: 24