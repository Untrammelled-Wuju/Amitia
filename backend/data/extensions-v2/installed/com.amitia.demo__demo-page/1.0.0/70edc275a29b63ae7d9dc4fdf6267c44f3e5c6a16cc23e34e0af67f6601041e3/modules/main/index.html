<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Amitia Demo Extension</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);min-height:100vh;display:flex;align-items:center;justify-content:center;color:#fff;padding:20px}
.container{text-align:center;max-width:640px;width:100%}
.logo{width:100px;height:100px;margin:0 auto 24px;border-radius:24px;background:rgba(255,255,255,0.15);backdrop-filter:blur(10px);border:2px solid rgba(255,255,255,0.3);display:flex;align-items:center;justify-content:center;font-size:48px;font-weight:bold;animation:pulse 2s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
h1{font-size:2.2em;margin-bottom:8px;text-shadow:0 2px 10px rgba(0,0,0,0.2)}
.subtitle{font-size:1.1em;opacity:0.85;margin-bottom:32px}
.card{background:rgba(255,255,255,0.12);backdrop-filter:blur(10px);border-radius:16px;padding:24px;margin:16px 0;border:1px solid rgba(255,255,255,0.15);text-align:left}
.card h2{font-size:1.15em;margin-bottom:8px;display:flex;align-items:center;gap:8px}
.card p{opacity:0.8;line-height:1.6;font-size:0.95em}
.features{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:16px}
.feature{background:rgba(255,255,255,0.08);padding:14px;border-radius:10px}
.feature-title{font-weight:600;margin-bottom:4px;font-size:0.95em}
.feature-desc{font-size:0.82em;opacity:0.75}
.badge{display:inline-block;padding:2px 10px;border-radius:20px;font-size:0.75em;background:rgba(255,255,255,0.2);margin-left:8px}
.footer{margin-top:32px;font-size:0.85em;opacity:0.6}
</style>
</head>
<body>
<div class="container">
  <div class="logo">A</div>
  <h1>Amitia Demo Extension</h1>
  <p class="subtitle">演示扩展包页面 &middot; web_page 贡献类型</p>

  <div class="card">
    <h2>扩展信息 <span class="badge">v1.0.0</span></h2>
    <p>这是通过 .amitiax 扩展包安装的 UI 页面。页面使用纯 HTML+CSS 构建，在沙箱 iframe 中安全渲染。</p>
  </div>

  <div class="card">
    <h2>技术特性</h2>
    <div class="features">
      <div class="feature">
        <div class="feature-title">扩展包格式</div>
        <div class="feature-desc">基于 ZIP 的 .amitiax 格式</div>
      </div>
      <div class="feature">
        <div class="feature-title">Manifest v2</div>
        <div class="feature-desc">标准化清单文件</div>
      </div>
      <div class="feature">
        <div class="feature-title">完整性校验</div>
        <div class="feature-desc">SHA256 哈希验证</div>
      </div>
      <div class="feature">
        <div class="feature-title">沙箱渲染</div>
        <div class="feature-desc">安全的 iframe 隔离</div>
      </div>
    </div>
  </div>

  <div class="footer">Powered by Amitia Extension Kernel</div>
</div>
</body>
</html>
