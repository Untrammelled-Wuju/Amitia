<body class="min-h-screen bg-black text-white font-sans antialiased" style="-webkit-font-smoothing:antialiased;">
<div class="min-h-screen bg-black flex flex-col">
<div style="padding:calc(8px + var(--safe-top)) 20px 8px;display:flex;align-items:center;justify-content:space-between;">
<button class="nav-back-btn haptic-touch">

<h1 style="font-size:28px;font-weight:700;letter-spacing:-0.3px;color:#fff;font-family:var(--font-sans);">创建账户</h1>
<p style="font-size:15px;color:rgba(235,235,245,0.5);margin-top:6px;font-family:var(--font-sans);">设置管理员账号以开始使用 Amitia</p>
<div style="margin-top:32px;display:flex;flex-direction:column;gap:18px;">
<div>
<label class="input-label">用户名</label>
<input type="text" class="ios-input ios-input-tall" placeholder="请输入用户名">
</div>
<div>
<label class="input-label">密码</label>
<div class="input-wrap">
<input type="password" class="ios-input ios-input-tall" placeholder="请输入密码" id="setupPwd1">
<button class="eye-toggle haptic-touch" onclick="toggleSetupPwd(1)" aria-label="显示密码">
<svg id="eyeIcon1" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
<circle cx="12" cy="12" r="3"/>
</svg>
</button>
</div>
</div>
<div>
<label class="input-label">确认密码</label>
<div class="input-wrap">
<input type="password" class="ios-input ios-input-tall" placeholder="请再次输入密码" id="setupPwd2">
<button class="eye-toggle haptic-touch" onclick="toggleSetupPwd(2)" aria-label="显示密码">
<svg id="eyeIcon2" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
<circle cx="12" cy="12" r="3"/>
</svg>
</button>
</div>
</div>
</div>
</div>
<div style="padding:32px 20px calc(20px + var(--safe-bottom));">
<button class="ios-btn-primary gold-glow haptic-touch" style="height:52px;">下一步</button>
</div>
</div>
<script>
function toggleSetupPwd(n){
  var inp=document.getElementById('setupPwd'+n);
  var icon=document.getElementById('eyeIcon'+n);
  if(inp.type==='password'){
    inp.type='text';
    icon.innerHTML='<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>';
  } else {
    inp.type='password';
    icon.innerHTML='<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>';
  }
}
</script>
