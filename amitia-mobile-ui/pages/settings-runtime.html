    <style>*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}body{font-family:var(--font-sans);background:var(--bg);color:var(--on-bg);min-height:100vh}.glass{background:rgba(24,24,27,0.72);backdrop-filter:blur(14px) saturate(180%);-webkit-backdrop-filter:blur(14px) saturate(180%);border:1px solid rgba(255,255,255,0.08)}.glass-strong{background:rgba(20,20,22,0.85);backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%);border:1px solid rgba(255,255,255,0.08)}.section-title{padding:20px 16px 8px;font-size:12px;color:#74716d;font-weight:600;text-transform:uppercase;letter-spacing:0.5px}.list-container{margin:0 16px;background:var(--surface);border:1px solid var(--outline-variant);border-radius:12px;overflow:hidden}.list-item{display:flex;align-items:center;min-height:52px;padding:0 14px;border-bottom:1px solid var(--outline-variant)}.list-item:last-child{border-bottom:none}.list-item-icon{width:20px;height:20px;color:#74716d;margin-right:12px;flex-shrink:0}.list-item-title{font-size:14px;flex:1;color:var(--on-bg)}.list-item-trailing{font-size:13px;color:#74716d;display:flex;align-items:center;gap:6px}.chevron{width:16px;height:16px;color:#74716d;flex-shrink:0}.toggle{position:relative;display:inline-block;width:44px;height:26px;flex-shrink:0}.toggle input{opacity:0;width:0;height:0}.toggle-track{position:absolute;cursor:pointer;top:0;left:0;right:0;bottom:0;background:var(--outline);border-radius:13px;transition:background .2s}.toggle-thumb{position:absolute;height:22px;width:22px;left:2px;bottom:2px;background:#fff;border-radius:50%;transition:transform .2s}.toggle input:checked+.toggle-track{background:var(--primary)}.toggle input:checked+.toggle-track .toggle-thumb{transform:translateX(18px)}.appbar{position:sticky;top:0;z-index:30;padding:calc(12px + var(--safe-top)) 16px 12px;display:flex;align-items:center;gap:12px;background:var(--bg);border-bottom:1px solid var(--outline-variant)}.btn-back{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;background:rgba(24,24,27,0.72);backdrop-filter:blur(14px) saturate(180%);-webkit-backdrop-filter:blur(14px) saturate(180%);border:1px solid rgba(255,255,255,0.08);color:var(--on-bg)}.appbar-title{font-size:17px;font-weight:600;flex:1;text-align:center;color:var(--on-bg)}input.field-input{width:100%;height:42px;background:var(--bg);border:1px solid var(--outline);border-radius:8px;padding:0 12px;font-size:14px;color:#f1f0ed;outline:none;font-family:var(--font-sans)}input.field-input:focus{border-color:var(--primary)}body{padding-bottom:calc(24px + var(--safe-bottom))}.dot-green{width:8px;height:8px;border-radius:50%;background:#75a184;flex-shrink:0}.progress-bar{height:4px;background:var(--outline);border-radius:2px;overflow:hidden}.progress-fill{height:100%;background:var(--primary);border-radius:2px}</style>
